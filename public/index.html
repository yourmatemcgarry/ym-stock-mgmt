/* The stocktake dialog and the run dialog use different field ids, so the
   pack list has to be told which pair to read. */
function syncPacks(b,keep,prodId,packId){
  const ps=$("#"+(prodId||"ep"),b), k=$("#"+(packId||"ek"),b);
  if(!ps||!k) return;
  const p=P(ps.value), cur=keep||k.value;
  clear(k); for(const q of ((p&&p.packs)||[]).length?p.packs:PACKS.map(c=>({code:c})))
    k.append(el("option",{value:q.code,selected:q.code===cur},q.code));
}

/* ============================ 3. PRODUCTION ============================ */
/* ---- the production timeline ----
   Weeks across the top; above the line what goes into tank and what comes out
   of the packaging hall each week against capacity, below it every run drawn
   from its brew week to its pack week, so a crowded fortnight is visible as a
   stack of bars rather than a list of dates. */
let prodWeeks = 26;
/* ---- tanks ----
   The vessels a brew can sit in, with what they hold. Kept on the config so
   they travel with the site rather than needing their own collection. A run
   names one tank and occupies it from its brew date to its pack date; several
   runs of the same beer can share a tank while they fit inside it. */
const TANK_SEED=[
  ["101",1000],["201",2400],["202",2400],["203",2400],["204",2400],
  ["401",4800],["404",4800],
  ["FV-01",10000],["FV-02",10000],["FV-03",10000],["FV-04",6000],["FV-05",6000],
  ["FV-06",8000],["FV-07",20000],["FV-08",20000],["FV-09",20000],["FV-10",20000],
  ["FV-11",4000],["FV-12",4000],
  ["Pilot-1",200],["Pilot-2",200],["Pilot-3",200],["Pilot-4",200],
  ["STAGING",8000],
  ["BBT-01",10000],["BBT-02",4000],["BBT-03",20000]];
function tanks(){ return (S.config.tanks||[]).filter(t=>t&&t.name); }
function tankOf(name){ return tanks().find(t=>t.name===name)||null; }
function seedTanks(){
  S.config.tanks=TANK_SEED.map(([name,cap])=>({name,cap}));
  saveConfig();
}
/* ---- where a brew sits ----
   A brew can be split across tanks: 12,000 L of Larry might go 8,000 into
   FV-07 and 4,000 into FV-11. Each slice is {tank, litres}. An older run with
   a single `tank` is read as one slice holding the lot. */
function runTanks(r){
  if(Array.isArray(r.tanks)&&r.tanks.length)
    return r.tanks.filter(x=>x&&x.tank).map(x=>({tank:x.tank,litres:num(x.litres)||0}));
  if(r.tank) return [{tank:r.tank,litres:brewLitres(r)}];
  return [];
}
function allocated(r){ return sum(runTanks(r).map(x=>x.litres)); }
/* what still has nowhere to go */
function unallocated(r){ return Math.max(0,Math.round((brewLitres(r)-allocated(r))*10)/10); }
function setRunTanks(r,list){
  const keep=list.filter(x=>x.tank&&num(x.litres)>0)
    .map(x=>({tank:x.tank,litres:Math.round(num(x.litres)*10)/10}));
  if(keep.length){ r.tanks=keep; r.tank=keep[0].tank; }
  else { delete r.tanks; delete r.tank; }
}
function brewStart(r){
  return r.brewDate||iso(new Date(D(r.packDate)-((P(r.productId)||{}).brewToPackDays||21)*DAY));
}
/* every brew with beer in this tank over a span of weeks */
function tankRuns(name,from,to){
  return S.runs.filter(r=>r.status!=="cancelled"&&r.packDate
    &&runTanks(r).some(x=>x.tank===name)
    &&monday(brewStart(r))<=to&&monday(r.packDate)>=from);
}
/* what a tank is holding week by week, and where it is in trouble: more
   litres than it takes, or two different beers in it at once */
function tankTrouble(name){
  const t=tankOf(name); if(!t) return [];
  const rs=S.runs.filter(r=>r.status!=="cancelled"&&r.packDate&&runTanks(r).some(x=>x.tank===name));
  const weeks=new Set();
  for(const r of rs){ weeks.add(monday(brewStart(r))); weeks.add(monday(r.packDate)); }
  const out=[];
  for(const w of weeks){
    const on=rs.filter(r=>monday(brewStart(r))<=w&&monday(r.packDate)>=w);
    if(!on.length) continue;
    const vol=sum(on.map(r=>(runTanks(r).find(x=>x.tank===name)||{}).litres||0));
    const brands=[...new Set(on.map(r=>r.productId))];
    if(vol>t.cap+0.5) out.push({week:w,kind:"over",vol:Math.round(vol),cap:t.cap,runs:on.length});
    else if(brands.length>1) out.push({week:w,kind:"mixed",brands,runs:on.length});
  }
  return out.sort((a,b)=>a.week<b.week?-1:1);
}
function brewWeek(r){ return monday(r.brewDate||r.packDate); }
function packWeek(r){ return monday(r.packDate); }
function capacityRows(weeks){
  const brew={}, pack={};
  for(const w of weeks){ brew[w]=0; pack[w]=0; }
  for(const r of S.runs){
    if(r.status==="cancelled") continue;
    const L=litres(r);
    const b=brewWeek(r), p=packWeek(r);
    if(b in brew) brew[b]+=L;
    if(p in pack) pack[p]+=L;
  }
  return {brew,pack};
}
/* ---- the tank schedule ----
   One row per tank, one column per week. A brew sits in its tank from the week
   it goes in to the week it is packaged, and can be split across tanks — each
   slice shows the litres in that tank. The top lane holds anything not yet in
   a tank. Double-click a bar to open the run; drag it sideways to move the
   weeks, up or down to move that slice to another tank, or take either end to
   change how long it is in tank. A tank goes amber when a week's contents add
   up to more than it holds, or two different beers are in it at once. */
let tankWeeks=16, tankFrom=null;
const WKW=46;
function tankTimeline(pane){
  const list=tanks();
  const card=el("div",{class:"card"});
  const start=tankFrom||wkAdd(S.config.currentWeek,-2);
  const loose=S.runs.filter(r=>r.status!=="cancelled"&&r.packDate&&unallocated(r)>0.5);
  card.append(el("header",{},el("h3",{},"Tank schedule"),
    el("span",{class:"hint"},list.length?"Drag a brew to move it; double-click to open it":"No tanks set up yet"),
    el("span",{style:"flex:1"}),
    loose.length?el("span",{class:"chip warn"},loose.length+" without a tank"):null,
    el("button",{class:"btn sm",onclick:()=>{tankFrom=wkAdd(start,-8);render();}},"◀"),
    el("button",{class:"btn sm",onclick:()=>{tankFrom=null;render();}},"Today"),
    el("button",{class:"btn sm",onclick:()=>{tankFrom=wkAdd(start,8);render();}},"▶"),
    sel([[8,"8 weeks"],[16,"16 weeks"],[26,"26 weeks"],[52,"52 weeks"]],tankWeeks,
      {onchange:e=>{tankWeeks=+e.target.value;render();}})));
  if(!list.length){
    card.append(el("div",{class:"empty"},el("b",{},"No tanks yet"),
      "Add them under Setup, or load the brewery's list there."));
    pane.append(card); return;
  }
  const weeks=[]; for(let i=0;i<tankWeeks;i++) weeks.push(wkAdd(start,i));
  const wkIx={}; weeks.forEach((w,i)=>wkIx[w]=i);
  const scroll=el("div",{class:"scroll tall"});
  const grid=el("div",{class:"tank",style:"width:"+(150+weeks.length*WKW)+"px"});

  const head=el("div",{class:"trow thead"});
  head.append(el("div",{class:"tname"},"Tank"));
  const lane=el("div",{class:"tlane"});
  weeks.forEach((w,i)=>{
    const c=el("div",{class:"tday mon"+(w===S.config.currentWeek?" today":""),
      style:"left:"+(i*WKW)+"px;width:"+WKW+"px"});
    c.append(el("b",{},fmtW(w)));
    c.title="w/c "+fmtD(w);
    lane.append(c);
  });
  head.append(lane); grid.append(head);

  /* anything with beer still to put somewhere */
  if(loose.length){
    const row=el("div",{class:"trow warnrow"});
    row.append(el("div",{class:"tname bad"},el("b",{},"Not in a tank"),
      el("span",{class:"hint"},loose.length+" brew"+(loose.length===1?"":"s"))));
    /* there can be a lot of these; the lane scrolls on its own rather than
       pushing the tanks off the screen */
    const l=el("div",{class:"tlane loose","data-tank":""});
    weeks.forEach((w,i)=>l.append(el("div",{class:"tday mon",
      style:"left:"+(i*WKW)+"px;width:"+WKW+"px"})));
    layoutBars(l,loose.map(r=>({r,litres:unallocated(r),tank:""})),weeks,wkIx,null);
    row.append(l); grid.append(row);
  }

  for(const t of list){
    const row=el("div",{class:"trow"});
    const bad=tankTrouble(t.name).filter(x=>wkIx[x.week]!=null);
    row.append(el("div",{class:"tname"+(bad.length?" bad":"")},
      el("b",{},t.name),el("span",{class:"hint"},n0(t.cap)+" L")));
    const l=el("div",{class:"tlane","data-tank":t.name});
    weeks.forEach((w,i)=>l.append(el("div",{class:"tday mon"+(w===S.config.currentWeek?" today":""),
      style:"left:"+(i*WKW)+"px;width:"+WKW+"px"})));
    const mine=[];
    for(const r of S.runs){
      if(r.status==="cancelled"||!r.packDate) continue;
      const slice=runTanks(r).find(x=>x.tank===t.name);
      if(!slice) continue;
      mine.push({r,litres:slice.litres,tank:t.name});
    }
    layoutBars(l,mine,weeks,wkIx,t);
    if(bad.length) row.classList.add("warnrow");
    row.append(l); grid.append(row);
  }
  scroll.append(grid); card.append(scroll);

  const trouble=list.map(t=>({t,bad:tankTrouble(t.name)})).filter(x=>x.bad.length);
  if(trouble.length){
    const n=el("div",{class:"note",style:"border-color:var(--warn)"});
    n.append(el("b",{},"Tank clashes. "));
    n.append(trouble.map(x=>{
      const f=x.bad[0];
      return x.t.name+" — "+(f.kind==="over"
        ?(n0(f.vol)+" L in a "+n0(x.t.cap)+" L tank, w/c "+fmtD(f.week))
        :("two beers at once, w/c "+fmtD(f.week)));
    }).join("; "));
    card.append(n);
  }
  if(loose.length){
    const n=el("div",{class:"note"});
    n.append(el("b",{},"Not in a tank. "));
    n.append(loose.slice(0,6).map(r=>(P(r.productId)||{}).name+" "+r.pack+" "
      +fmtD(r.packDate)+" ("+n0(unallocated(r))+" L)").join("; ")
      +(loose.length>6?" and "+(loose.length-6)+" more":"")
      +". Drag one onto a tank, or open it and split it across a few.");
    card.append(n);
  }
  pane.append(card);
}
/* bars for one lane, stacked so brews sharing a tank are all visible */
function layoutBars(l,items,weeks,wkIx,tank){
  const put=items.map(x=>Object.assign({},x,{w0:monday(brewStart(x.r)),w1:monday(x.r.packDate)}))
    .filter(x=>x.w1>=weeks[0]&&x.w0<=weeks[weeks.length-1])
    .sort((a,b)=>a.w0<b.w0?-1:1);
  const ends=[];
  for(const x of put){
    let k=ends.findIndex(e=>e<x.w0);
    if(k<0){ k=ends.length; ends.push(""); }
    ends[k]=x.w1; x.lane=k;
  }
  if(ends.length>1){
    /* the unallocated lane can hold a hundred brews: cap it and let it scroll,
       rather than pushing every tank off the screen */
    const want=ends.length*26+6, cap=l.classList.contains("loose")?132:want;
    l.style.minHeight=Math.min(want,cap)+"px";
    if(want>cap){ l.style.height=cap+"px";
      for(const d of l.querySelectorAll(".tday")) d.style.height=want+"px"; }
  }
  for(const x of put){
    const r=x.r;
    const i0=Math.max(0,wkIx[x.w0]!=null?wkIx[x.w0]:0);
    const i1=Math.min(weeks.length-1,wkIx[x.w1]!=null?wkIx[x.w1]:weeks.length-1);
    const over=tank&&x.litres>tank.cap+0.5;
    const bar=el("div",{class:"tbar"+(over?" over":"")+(tank?"":" loose"),
      "data-run":r.id,"data-tank":x.tank||"",
      style:"left:"+(i0*WKW+1)+"px;width:"+((i1-i0+1)*WKW-2)+"px;"
           +(ends.length>1?"top:"+(3+x.lane*26)+"px;height:22px;bottom:auto;":"")
           +"background:"+brandColour(r.productId)});
    const split=runTanks(r);
    bar.title=(P(r.productId)||{}).name+" "+r.pack+" · "+(partUnits(r.productId,r.pack)?nq:n0)(runUnits(r))+" "
      +(PACK_UNIT[r.pack]||"units").toLowerCase()+"\n"
      +n0(brewLitres(r))+" L to brew"
      +(split.length>1?", split across "+split.map(y=>y.tank+" "+n0(y.litres)+" L").join(" + "):"")
      +"\n"+fmtD(brewStart(r))+" → "+fmtD(r.packDate)
      +(tank?"\n"+n0(x.litres)+" L in "+tank.name
            +(split.length>1?" — packages "+(partUnits(r.productId,r.pack)?nq:n0)(
                runUnits(r)*(brewLitres(r)>0?x.litres/brewLitres(r):1))+" "+packShort(r.pack):"")
            :"\nNot in a tank yet")
      +(over?"\nMore than this tank's "+n0(tank.cap)+" L":"");
    bar.append(el("span",{class:"grab l"}));
    /* what this tank's share will package. A brew split across tanks shows
       each tank's share, so the two bars add up to the run rather than each
       claiming the whole of it. */
    const whole=brewLitres(r)||0;
    const share=whole>0?Math.min(1,x.litres/whole):1;
    const units=runUnits(r)*share;
    const uf=partUnits(r.productId,r.pack)?nq:n0;
    bar.append(el("span",{class:"lab"},
      (P(r.productId)||{}).name+" "+r.pack+" · "
      +uf(units)+" "+packShort(r.pack)+" · "+kl(x.litres)+"L"));
    bar.append(el("span",{class:"grab r"}));
    bar.addEventListener("dblclick",ev=>{ev.stopPropagation();newRun(null,null,null,r);});
    bar.addEventListener("pointerdown",ev=>tankDrag(ev,r,x.tank,x.litres));
    l.append(bar);
  }
}
/* dragging a bar: the body moves it a week at a time or into another tank,
   either end stretches it */
function tankDrag(ev,r,fromTank,slice){
  const bar=ev.currentTarget;
  const edge=ev.target.classList.contains("grab")
    ? (ev.target.classList.contains("l")?"l":"r") : null;
  const b0=brewStart(r);
  const x0=ev.clientX, y0=ev.clientY, w0=bar.offsetWidth;
  const span=wkDiff(monday(b0),monday(r.packDate));
  bar.classList.add("dragging");
  let moved=0, shift=0, tank=fromTank;
  const lanes=[...document.querySelectorAll(".tank .tlane[data-tank]")];
  const move=e=>{
    const dx=e.clientX-x0, dy=e.clientY-y0;
    moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
    shift=Math.round(dx/WKW);
    if(edge==="l"){
      bar.style.width=Math.max(WKW-2,w0-shift*WKW)+"px";
      bar.style.transform="translateX("+(shift*WKW)+"px)";
    } else if(edge==="r"){
      bar.style.width=Math.max(WKW-2,(span+1+shift)*WKW-2)+"px";
    } else {
      bar.style.transform="translateX("+(shift*WKW)+"px) translateY("+dy+"px)";
      const hit=lanes.find(l=>{const b=l.getBoundingClientRect();
        return e.clientY>=b.top&&e.clientY<=b.bottom;});
      tank=hit?hit.getAttribute("data-tank"):fromTank;
    }
  };
  const up=()=>{
    window.removeEventListener("pointermove",move);
    window.removeEventListener("pointerup",up);
    bar.classList.remove("dragging");
    /* a click, not a drag: put it back and leave the DOM alone, or the second
       click of a double-click lands on an element that no longer exists */
    if(moved<4){ bar.style.transform=""; bar.style.width=w0+"px"; return; }
    const shiftWk=d=>iso(new Date(+D(d)+shift*7*DAY));
    if(edge==="l"){
      const nb=shiftWk(b0);
      if(nb<r.packDate) r.brewDate=nb;
    } else if(edge==="r"){
      const np=shiftWk(r.packDate);
      if(np>b0) r.packDate=np;
    } else {
      r.brewDate=shiftWk(b0); r.packDate=shiftWk(r.packDate);
      if(tank!==fromTank){
        /* move this slice, leaving any other tanks on the brew alone */
        const rest=runTanks(r).filter(x=>x.tank!==fromTank);
        const vol=slice||unallocated(r)||brewLitres(r);
        if(tank) rest.push({tank,litres:vol});
        setRunTanks(r,rest);
      }
    }
    persist("runs",r); S.calcCache=null;
    const where=runTanks(r);
    flash((P(r.productId)||{}).name+" "+r.pack+" → "
      +(where.length?where.map(x=>x.tank).join(" + "):"no tank")+", "
      +fmtD(brewStart(r))+" → "+fmtD(r.packDate));
    render();
  };
  /* on the window, not the bar: the pointer leaves the bar as soon as it moves
     to another tank's row, and the drag has to keep following it */
  window.addEventListener("pointermove",move);
  window.addEventListener("pointerup",up);
  ev.preventDefault();
}

/* ---- the forecast, read for brewing ----
   Per SKU, only the two lines that matter when you are deciding what to brew:
   what is left in the coldroom at the end of each week, and what is booked to
   be packaged. Grouped under the brand, with the brand's own weekly litres on
   top — that total is what has to have been brewed to feed it. */
function brandOutlook(pane,all){
  const cw=S.config.currentWeek;
  const weeks=[]; for(let i=0;i<prodWeeks;i++) weeks.push(wkAdd(cw,i));
  const byBrand={};
  for(const s of skus()){
    if(s.product.forecast===false) continue;
    const c=all[s.id]; if(!c) continue;
    const packed=weeks.map(w=>i2(c,w,"in"));
    const endSoh=weeks.map(w=>i2(c,w,"cold"));
    if(!packed.some(v=>v>0)&&!endSoh.some(v=>v!=null)) continue;
    (byBrand[s.product.id]=byBrand[s.product.id]||{p:s.product,rows:[]})
      .rows.push({s,packed,endSoh,
        litres:packed.map(u=>u*litresPerUnit(s.product.id,s.pack))});
  }
  const card=el("div",{class:"card"});
  card.append(el("header",{},el("h3",{},"What the forecast needs brewed"),
    el("span",{class:"hint"},"Coldroom at the end of each week against what is booked to be packaged"),
    el("span",{style:"flex:1"}),
    el("span",{class:"hint"},prodWeeks+" weeks")));
  const scroll=el("div",{class:"scroll tall"});
  const tb=el("table",{class:"tl outlook",style:"width:"+(230+weeks.length*46)+"px"});
  const hr=el("tr",{},el("th",{class:"stick"},"Week commencing"));
  weeks.forEach((w,i)=>{
    const th=el("th",{class:"wkh"+(i===0?" now":"")},el("b",{},fmtW(w)),
      i===0||D(w).getUTCMonth()===0&&D(wkAdd(w,-1)).getUTCMonth()===11
        ?String(D(w).getUTCFullYear()).slice(2):"");
    th.title=w; hr.append(th);
  });
  tb.append(el("thead",{},hr));
  const body=el("tbody");
  const brands=Object.values(byBrand).sort((a,b)=>(a.p.sort|0)-(b.p.sort|0));
  for(const g of brands){
    const col=brandColour(g.p.id);
    /* the brand's week: every pack of it added up, in litres */
    const tot=weeks.map((w,i)=>sum(g.rows.map(r=>r.litres[i])));
    const trb=el("tr",{class:"cap brandrow"});
    trb.append(el("td",{class:"stick"},el("div",{class:"lbl"},
      el("span",{class:"sw",style:"background:"+col}),el("b",{},g.p.name),
      el("span",{class:"hint"},"to brew"))));
    tot.forEach((v,i)=>{
      const td=el("td",{class:"v"+(v>0?"":" past")});
      if(v>0){
        /* what has to go in the tank, at each pack's own yield */
        const brew=sum(g.rows.map(r=>r.packed[i]*litresPerUnit(g.p.id,r.s.pack)/yieldOf(g.p.id,r.s.pack)));
        td.textContent=kl(brew);
        td.title=n0(brew)+" L into tank for "+n0(v)+" L packaged";

/* a week's figure out of a computed SKU, past or forecast */
function i2(c,w,what){
  const pi=c.past.indexOf(w), fi=c.weeks.indexOf(w);
  if(what==="in"){
    if(pi>=0){const v=(c.pastIn||[])[pi];
      return v!=null?v:sum(runsInWeek(c.sku,w).map(runUnits));}
    return fi>=0?(c.beerIn[fi]||0):0;
  }
  if(pi>=0){
    const s0=(c.pastCold||[])[pi]; if(s0==null) return null;
    const inn=(c.pastIn||[])[pi]!=null?(c.pastIn||[])[pi]:sum(runsInWeek(c.sku,w).map(runUnits));
    const out=(w===S.config.currentWeek)?c.outNow:((c.pastTotalOut||[])[pi]||0);
    return Math.round(s0+inn+((c.pastBack||[])[pi]||0)-out);
  }
  return fi>=0?Math.round(c.cold[fi]):null;
}

/* Litres in one unit of a pack. The defaults above are the standard sizes; a
   product can set its own in Setup, which is what a short-fill carton or an
   odd keg needs. */
function packSpec(productId,pack){
  const p=P(productId);
  return ((p&&p.packs)||[]).find(q=>q.code===pack)||{};
}
function litresPerUnit(productId,pack){
  const v=num(packSpec(productId,pack).litres);
  return v!=null&&v>0?v:(LPU[pack]||1);
}
function yieldOf(productId,pack){
  const v=num(packSpec(productId,pack).efficiency);
  return v!=null&&v>0&&v<=100?v/100:0.9;
}
/* what comes out of the run, packaged */
function litres(r){ return runUnits(r)*litresPerUnit(r.productId,r.pack); }
/* and what has to go into the tank to get it, at this SKU's yield */
function brewLitres(r){ return litres(r)/yieldOf(r.productId,r.pack); }

function newRun(sku,packDate,units,existing){
  const s=sku?{pid:sku.split("__")[0],pack:(skus().find(x=>x.id===sku)||{}).pack}:null;
  const r=existing||{id:uid("run"),productId:s?s.pid:(S.products[0]||{}).id,pack:s?s.pack:"Can",
    packDate:packDate||wkAdd(S.config.currentWeek,2),units:units||"",status:"planned",note:""};
  openDialog(existing?"Edit packaging run":"Schedule packaging run",b=>{
    b.append(el("div",{class:"grid2"},
      field("Product",sel(S.products.map(p=>[p.id,p.name]),r.productId,{id:"rp",onchange:()=>{syncPacks(b,null,"rp","rk");syncBrew(b);}})),
      field("Pack",sel(PACKS.map(p=>[p,p]),r.pack,{id:"rk",onchange:()=>syncBrew(b)}))));
    b.append(el("div",{class:"grid3"},
      field("Brew date",el("input",{type:"date",id:"rb",value:r.brewDate||"",
        onchange:()=>syncBrew(b,true)}),"When it goes into the tank"),
      field("Pack date",el("input",{type:"date",id:"rd",value:r.packDate,onchange:()=>syncBrew(b)})),
      field("Units planned",el("input",{type:"number",id:"ru",value:r.units,placeholder:"576",
        oninput:()=>volNote(b)}))));
    b.append(el("div",{class:"grid2"},
      field("Units actually packaged",el("input",{type:"number",id:"ra",
        value:r.actualUnits!=null?r.actualUnits:"",placeholder:"leave blank until it's run",
        oninput:()=>volNote(b)}),
        "Once this is filled in the coldroom works off it, not the plan"),
      el("div",{})));
    b.append(el("div",{class:"grid2"},
      field("Status",sel([["planned","Planned"],["confirmed","Confirmed"],["cancelled","Cancelled"]],r.status,{id:"rs"})),
      el("div",{class:"note",id:"rvol",style:"margin:0"},"—")));
    b.append(el("div",{class:"note",id:"rbrew"},"—"));
    /* tanks: one line each, so a brew can be split across a few */
    b.append(el("div",{class:"fld"},"Tanks"));
    const tk=el("div",{id:"rtanks",style:"display:flex;flex-direction:column;gap:6px"});
    const addRow=(tank,lt)=>{
      const row=el("div",{class:"row",style:"gap:8px;align-items:center"});
      const ts=sel([["","— pick a tank —"],...tanks().map(t=>[t.name,t.name+"  ·  "+n0(t.cap)+" L"])],
        tank||"",{class:"rtk"});
      const li=el("input",{type:"number",class:"rtl",step:"1",min:"0",style:"max-width:120px",
        value:lt!=null?Math.round(lt):"",placeholder:"litres"});
      ts.addEventListener("change",()=>volNote(b));
      li.addEventListener("input",()=>volNote(b));
      row.append(ts,li,el("span",{class:"hint"},"L"),
        el("button",{class:"btn sm",type:"button",title:"Remove this tank",
          onclick:()=>{row.remove();volNote(b);}},"×"));
      tk.append(row);
    };
    for(const x of runTanks(r)) addRow(x.tank,x.litres);
    if(!runTanks(r).length) addRow("",null);
    b.append(tk);
    b.append(el("div",{class:"row",style:"gap:8px"},
      el("button",{class:"btn sm",type:"button",onclick:()=>{addRow("",null);volNote(b);}},"Split across another tank"),
      el("button",{class:"btn sm",type:"button",title:"Put all of it in the first tank",
        onclick:()=>{const rows=[...$("#rtanks",b).children];
          if(!rows.length) return;
          const need=brewVolFrom(b);
          rows.forEach((row,i)=>{row.querySelector(".rtl").value=i===0?Math.round(need):"";});
          volNote(b);}},"Fill the first")));
    b.append(field("Note",el("input",{type:"text",id:"rn",value:r.note||"",placeholder:"Tank 4, double batch"})));
    if(existing) b.append(el("button",{class:"btn danger",type:"button",style:"align-self:flex-start",
      onclick:()=>{S.runs=S.runs.filter(x=>x.id!==r.id);remove("runs",r.id);$("#dlg").close();render();}},"Delete run"));
    syncPacks(b,r.pack,"rp","rk"); syncBrew(b); volNote(b);
  },body=>{
    const act=num($("#ra",body).value);
    const rec={id:r.id,productId:$("#rp",body).value,pack:$("#rk",body).value,packDate:$("#rd",body).value,
      units:num($("#ru",body).value)||0,status:$("#rs",body).value,note:$("#rn",body).value.trim()};
    if(act!=null) rec.actualUnits=act;
    setRunTanks(rec,[...$("#rtanks",body).children].map(row=>({
      tank:row.querySelector(".rtk").value,
      litres:num(row.querySelector(".rtl").value)})));

      ||iso(new Date(D(rec.packDate)-(p.brewToPackDays||21)*DAY));
    const i=S.runs.findIndex(x=>x.id===rec.id);
    if(i>=0) S.runs[i]=rec; else S.runs.push(rec);
    persist("runs",rec); flash("Run saved — the coldroom forecast has moved");
  },existing?"Save":"Schedule");

/* the volume the dialog is working with, from whatever is typed in it now */
function brewVolFrom(b){
  const pid=$("#rp",b).value, pack=$("#rk",b).value;
  const u=num($("#ra",b).value)!=null?num($("#ra",b).value):(num($("#ru",b).value)||0);
  return u*litresPerUnit(pid,pack)/yieldOf(pid,pack);
}
/* what this run is, in litres: what comes out packaged, what has to go in the
   tank to get it, and whether the tanks named add up to that */
function volNote(b){
  const n=$("#rvol",b); if(!n) return;
  const pid=$("#rp",b).value, pack=$("#rk",b).value;
  const u=num($("#ra",b).value)!=null?num($("#ra",b).value):(num($("#ru",b).value)||0);
  const packaged=u*litresPerUnit(pid,pack), brew=brewVolFrom(b);
  const rows=$("#rtanks",b)?[...$("#rtanks",b).children]:[];
  const inTanks=sum(rows.map(x=>num(x.querySelector(".rtl").value)||0));
  const short=Math.round(brew-inTanks);
  clear(n);
  n.append(el("b",{},n0(packaged)+" L packaged"),
    " from "+n0(brew)+" L in tank, at "+Math.round(yieldOf(pid,pack)*100)+"% yield "
    +"("+n1(litresPerUnit(pid,pack))+" L per "+(PACK_UNIT[pack]||"unit").toLowerCase().replace(/s$/,"")+")");
  if(rows.length&&inTanks>0){
    n.append(el("div",{class:"hint",style:short>1?"color:var(--warn)":short<-1?"color:var(--warn)":""},
      short>1?(n0(inTanks)+" L allocated — "+n0(short)+" L still has nowhere to go")
      :short<-1?(n0(inTanks)+" L allocated — "+n0(-short)+" L more than the brew")
      :(n0(inTanks)+" L allocated, which is all of it")));
  }
  /* a tank that can't hold what is being put in it */
  for(const row of rows){
    const t=tankOf(row.querySelector(".rtk").value), v=num(row.querySelector(".rtl").value)||0;
    if(t&&v>t.cap+0.5) n.append(el("div",{class:"hint",style:"color:var(--crit)"},
      t.name+" holds "+n0(t.cap)+" L — "+n0(v)+" L won't fit"));
  }
}
function syncBrew(b,fromBrew){
  const p=P($("#rp",b).value)||{brewToPackDays:21};
  const d=$("#rd",b).value, bd=$("#rb",b);
  const n=$("#rbrew",b); clear(n);
  if(!d){n.textContent="Pick a pack date to see the brew date.";return;}
  const lead=p.brewToPackDays||21;
  const implied=iso(new Date(D(d)-lead*DAY));
  /* changing the pack date re-dates the brew unless the brew date is what moved */
  if(bd&&!fromBrew) bd.value=implied;
  const actual=(bd&&bd.value)||implied;
  const days=Math.round(dDiff(actual,d));
  n.append(el("b",{},"Brew "+fmtD(actual)+", pack "+fmtD(d)+" — "+days+" days in tank. "),
    (days===lead?"That's the ":"The ")+(p.name||"product")+" default of "+lead+" days"+
    (days===lead?". ":", so this one is "+Math.abs(days-lead)+" days "+(days>lead?"longer":"shorter")+". ")+
    "It lands in the coldroom in the week commencing "+fmtW(monday(d))+".");
}
function runsInWeek(sku,week){
  return S.runs.filter(r=>skuId(r.productId,r.pack)===sku&&monday(r.packDate)===week&&r.status!=="cancelled");

    .slice().sort((a,b)=>a.wk<b.wk?1:-1);
  openDialog("Returns — "+s.product.name+" "+s.pack,b=>{
    b.append(el("div",{class:"note"},
      "A return takes stock off that channel's shelf and out of their drawdown. ",
      el("b",{},"Back to the coldroom "),"makes it sellable again; ",
      el("b",{},"quarantined "),"and ",el("b",{},"written off "),"are recorded but add nothing back."));
    const form=el("div",{class:"grid3"});
    const chans=compute(s.id).rows.filter(r=>r.tracks).map(r=>[r.loc.id,r.loc.name]);
    const all=chans.length?chans:S.locations.map(l=>[l.id,l.name]);
    form.append(
      field("Channel",sel(all,locId||all[0][0],{id:"rtl"})),
      field("Week",el("input",{type:"date",id:"rtw",value:S.config.currentWeek}),"Snaps to the Monday"),
      field("Units",el("input",{type:"number",id:"rtq",step:"0.5",placeholder:"12"})));
    b.append(form);
    b.append(el("div",{class:"grid2"},
      field("Where it went",sel(Object.entries(RET_DEST),"coldroom",{id:"rtd"})),
      field("Reason",el("input",{type:"text",id:"rtn",placeholder:"Short-dated, rejected on delivery"}))));
    b.append(el("button",{class:"btn pri",type:"button",style:"align-self:flex-start",onclick:()=>{
      const q=num($("#rtq",b).value);
      if(!q){flash("How many came back?");return;}
      addReturn(s.id,{wk:monday($("#rtw",b).value||S.config.currentWeek),loc:$("#rtl",b).value,
        qty:q,dest:$("#rtd",b).value,note:$("#rtn",b).value.trim()});
      $("#dlg").close(); render(); flash("Return recorded");
    }},"Record this return"));
    const have=list();
    if(have.length){
      const t=el("table",{class:"mini"});
      t.append(el("thead",{},el("tr",{},el("th",{},"Week"),el("th",{},"Channel"),
        el("th",{class:"num"},"Units"),el("th",{},"Where it went"),el("th",{},"Reason"),el("th",{},""))));
      const body=el("tbody");
      for(const r of have) body.append(el("tr",{},
        el("td",{class:"mono"},fmtW(r.wk)),
        el("td",{},(L(r.loc)||{name:r.loc}).name),
        el("td",{class:"num"},n0(r.qty)),
        el("td",{},el("span",{class:"chip "+(r.dest==="coldroom"?"ok":r.dest==="writeoff"?"warn":"")},RET_DEST[r.dest]||r.dest)),
        el("td",{class:"dim"},r.note||"—"),
        el("td",{},el("button",{class:"btn sm",type:"button",title:"Remove this return",
          onclick:()=>{if(!confirm("Remove this return? The drawdown goes back to what it was."))return;
            dropReturn(s.id,r.id);$("#dlg").close();render();}},"×"))));
      t.append(body); b.append(t);
    } else {
      b.append(el("div",{class:"empty"},"Nothing recorded yet for this SKU."));
    }
  },()=>{render();},"Done");
}
</script>
<script>
"use strict";
/* ============================ WEEK ACTUALS ============================
   Each week there is exactly one thing nobody else can tell us: what we
   actually shipped. Stock on hand comes from the stocktake, and a
   distributor's drawdown falls out of the two together — so this screen asks
   for shipments only, and fills the rest in. */


/* A reported stock on hand is the same kind of fact as a count: it fixes that
   week's drawdown, and the week after it, since both are worked out from it. */
function setTheirSOH(sku,locId,wk,val){
  histSet(sku,"soh",locId,wk,num(val));
  deriveUsed(sku,locId,wk);
  deriveUsed(sku,locId,wkAdd(wk,1));
  S.calcCache=null;
  queueHistSave(sku);
}
function setActual(sku,locId,wk,val){
  const v=num(val);
  histSet(sku,"out",locId,wk,v);
  /* a shipment changes the drawdown implied for the week it lands and the next */
  const l=L(locId), lead=l?Math.max(0,l.leadTimeWeeks||0):0;
  deriveUsed(sku,locId,wkAdd(wk,lead));
  deriveUsed(sku,locId,wkAdd(wk,lead+1));
  S.calcCache=null;
  queueHistSave(sku);
}
let histTimer=null; const histDirty=new Set();
function queueHistSave(sku){
  histDirty.add(sku);
  clearTimeout(histTimer);
  histTimer=setTimeout(()=>{
    for(const s of histDirty) persist("history",stripIx(S.hist[s]));
    histDirty.clear();
  },700);
}

/* ============================ line chart ============================
   Small SVG line chart: 2px marks, recessive grid, direct labels at the right
   edge, legend above, and a crosshair tooltip. Text takes ink tokens, never a
   series colour — the swatch beside it carries identity. */

const VIZ = {
  slot: ["--viz-1", "--viz-2", "--viz-3"],
  of(i){ return "var(" + VIZ.slot[i % VIZ.slot.length] + ")"; }
};
const svgEl=(t,a)=>{const n=document.createElementNS("http://www.w3.org/2000/svg",t);
  for(const k in (a||{})) if(a[k]!=null) n.setAttribute(k,a[k]); return n;};

function niceTicks(lo,hi,n){
  if(hi===lo){ hi=lo+1; }
  const raw=(hi-lo)/n, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||mag*10;
  const out=[]; for(let v=Math.floor(lo/step)*step; v<=hi+1e-9; v+=step) out.push(v);
  return out;
}

/* series: [{name, values:[n|null], dash, color, label}]  x: [labels]
   markAt/markLabel draw a rule where the record stops and the forecast starts */
function lineChart(opts){
  const S_=opts.series.filter(s=>s.values.some(v=>v!=null));
  const col=i=>S_[i].color||VIZ.of(i);
  const wrap=el("figure",{class:"viz"});
  if(opts.title) wrap.append(el("figcaption",{},opts.title,
    opts.note?el("span",{class:"hint"}," "+opts.note):null));
  if(S_.length>1){
    const lg=el("div",{class:"viz-legend"});
    S_.forEach((s,i)=>lg.append(el("span",{class:"viz-key"},
      el("i",{style:"background:"+col(i)+(s.dash?";opacity:.85":"")}),s.name)));
    wrap.append(lg);
  }
  const W=760,Hh=250,L=56,R=152,T=20,B=30;
  const all=S_.flatMap(s=>s.values).filter(v=>v!=null);
  const lo=Math.min(0,...all), hi=Math.max(1,...all);
  const ticks=niceTicks(lo,hi,4), yMax=ticks[ticks.length-1], yMin=ticks[0];
  const n=opts.x.length;
  const px=i=>L+(n<2?0:i*(W-L-R)/(n-1));
  const py=v=>T+(Hh-T-B)*(1-(v-yMin)/(yMax-yMin||1));
  const svg=svgEl("svg",{viewBox:"0 0 "+W+" "+Hh,class:"viz-svg",
    role:"img","aria-label":opts.title||"chart",preserveAspectRatio:"xMidYMid meet"});

  for(const t of ticks){
    svg.append(svgEl("line",{x1:L,x2:W-R,y1:py(t),y2:py(t),class:"viz-grid"}));
    const lb=svgEl("text",{x:L-8,y:py(t)+4,class:"viz-axis","text-anchor":"end"});
    lb.textContent=n0(t); svg.append(lb);
  }
  const step=Math.max(1,Math.ceil(n/7));
  const shown=[];
  opts.x.forEach((lab,i)=>{
    if(i%step&&i!==n-1) return;
    if(shown.length&&px(i)-shown[shown.length-1]<48) return;   /* no collisions */
    shown.push(px(i));
    const t=svgEl("text",{x:px(i),y:Hh-10,class:"viz-axis","text-anchor":"middle"});
    t.textContent=lab; svg.append(t);
  });

  const ends=[];
  S_.forEach((s,i)=>{
    const pts=[];
    s.values.forEach((v,k)=>{ if(v!=null) pts.push(px(k)+","+py(v)); });
    if(!pts.length) return;
    svg.append(svgEl("polyline",{points:pts.join(" "),fill:"none",stroke:col(i),
      "stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round",
      "stroke-dasharray":s.dash||null}));
    let last=-1; s.values.forEach((v,k)=>{ if(v!=null) last=k; });
    if(last>=0&&s.label!==false){
      svg.append(svgEl("circle",{cx:px(last),cy:py(s.values[last]),r:4,
        fill:col(i),stroke:"var(--surface)","stroke-width":2}));
      ends.push({i,x:px(last),y:py(s.values[last]),
                 text:s.name+"  "+n0(s.values[last])});
    }
  });
  ends.sort((a,b)=>a.y-b.y);
  const topY=T+6, botY=Hh-B-4;
  ends.forEach((e,k)=>{
    let y=Math.max(topY,Math.min(botY,e.y+4));
    if(k&&y-ends[k-1]._y<15) y=ends[k-1]._y+15;
    e._y=Math.min(botY,y);
    const t=svgEl("text",{x:e.x+9,y:e._y,class:"viz-label"});
    t.textContent=e.text; svg.append(t);
  });

  if(opts.markAt!=null&&opts.markAt>=0&&opts.markAt<n){
    svg.append(svgEl("line",{x1:px(opts.markAt),x2:px(opts.markAt),y1:T,y2:Hh-B,
      class:"viz-mark"}));
    const ml=svgEl("text",{x:px(opts.markAt)+5,y:T+10,class:"viz-axis","text-anchor":"start"});
    ml.textContent=opts.markLabel||"now"; svg.append(ml);
  }
  const cross=svgEl("line",{x1:0,x2:0,y1:T,y2:Hh-B,class:"viz-cross",opacity:0});
  svg.append(cross);
  const hit=svgEl("rect",{x:L,y:T,width:Math.max(1,W-L-R),height:Hh-T-B,
    fill:"transparent",style:"cursor:crosshair"});
  svg.append(hit);
  const tip=el("div",{class:"viz-tip",hidden:true});
  const box=el("div",{class:"viz-plot"},svg,tip);
  hit.addEventListener("mousemove",ev=>{
    const r=svg.getBoundingClientRect();
    const xv=(ev.clientX-r.left)/r.width*W;
    let i=Math.round((xv-L)/((W-L-R)/Math.max(1,n-1)));
    i=Math.max(0,Math.min(n-1,i));
    cross.setAttribute("x1",px(i)); cross.setAttribute("x2",px(i));
    cross.setAttribute("opacity",1);
    clear(tip); tip.hidden=false;
    tip.append(el("b",{},opts.x[i]));
    S_.forEach((s,k)=>{ if(s.values[i]==null) return;
      tip.append(el("div",{class:"viz-tiprow"},
        el("i",{style:"background:"+col(k)}),
        el("span",{},s.name),el("b",{},n0(s.values[i]))));});
    const leftPct=(px(i)/W)*100;
    tip.style.left=Math.min(78,Math.max(2,leftPct))+"%";
  });
  hit.addEventListener("mouseleave",()=>{cross.setAttribute("opacity",0);tip.hidden=true;});
  wrap.append(box);
  return wrap;
}
</script>
<script>
"use strict";
/* ============================ REVIEW ============================
   Two questions: are we shipping more or less than the last two years, and
   which forecast basis has actually been predicting us well. Both read the
   same weekly history the forecast runs on. */

let revSku = null, revWeeks = 52, revFwd = 26, revTab = "yoy";

function reviewSkus(){
  return skus().filter(s=>S.hist[s.id]&&s.product.forecast!==false);
}
function reviewSku(){
  const list=reviewSkus();
  if(revSku&&list.some(s=>s.id===revSku)) return revSku;
  return list.length?list[0].id:null;
}
/* the last week that is actually over — this week is still being shipped */
const lastFullWeek = () => wkAdd(S.config.currentWeek,-1);
const outAt = (sku,loc,wk) => at(sku,"out",histLoc(sku,"out",loc),wk);

function periodWeeks(endWk,n){
  const out=[]; for(let i=n-1;i>=0;i--) out.push(wkAdd(endWk,-i));
  return out;
}
function periodTotal(sku,loc,endWk,n){
  let t=0,seen=false;
  for(const w of periodWeeks(endWk,n)){
    const v=outAt(sku,loc,w);
    if(v!=null){ t+=v; seen=true; }
  }
  return seen?t:null;
}
function reviewChannels(sku){
  return activeLocs().filter(l=>[0,52,104].some(off=>
    (periodTotal(sku,l.id,wkAdd(lastFullWeek(),-off),revWeeks)||0)>0));
}
const pctChange=(now,then)=>(then?((now-then)/then*100):null);

function viewReview(pane,ctl){
  const list=reviewSkus();
  if(!list.length){
    pane.append(el("div",{class:"card"},el("div",{class:"empty"},
      el("b",{},"Nothing to review yet"),"Once there's a season of shipments behind you this fills in.")));
    return;
  }
  const sku=reviewSku();
  ctl.append(sel(list.map(s=>[s.id,s.product.name+" "+s.pack]),sku,
    {onchange:e=>{revSku=e.target.value;render();}}));
  ctl.append(sel([[52,"52 wks back"],[26,"26 wks back"],[13,"13 wks back"]],revWeeks,
    {onchange:e=>{revWeeks=+e.target.value;render();}}));
  if(revTab==="yoy") ctl.append(sel([[13,"13 wks on"],[26,"26 wks on"],[52,"52 wks on"]],revFwd,
    {onchange:e=>{revFwd=+e.target.value;render();}}));
  const seg=el("div",{class:"packtabs"});
  for(const [k,lab] of [["yoy","Trend"],["acc","Forecast accuracy"]])
    seg.append(el("button",{"aria-pressed":String(revTab===k),
      onclick:()=>{revTab=k;render();}},lab));
  ctl.append(seg);
  (revTab==="yoy"?reviewTrend:reviewAccuracy)(pane,sku);
}

/* ---------------- the trend, behind and ahead ----------------
   One question in two halves: are we shipping more or less than the last two
   years, and does the forecast in front of us follow the same shape. Both are
   drawn on one timeline so the forecast can be sense-checked against the years
   it is meant to resemble. */

/* weekly figures are lumpy; a four-week mean is what makes a season legible */
function smooth(vals,w){
  return vals.map((_,i)=>{
    let t=0,n=0;
    for(let k=Math.max(0,i-w+1);k<=i;k++){ if(vals[k]!=null){t+=vals[k];n++;} }
    return n?t/n:null;
  });
}
function weekTotal(sku,chans,wk){
  let t=0,any=false;
  for(const l of chans){ const v=outAt(sku,l.id,wk); if(v!=null){t+=v;any=true;} }
  return any?t:null;
}
/* what the forecast says will go out, by channel and by week */
function forwardView(sku,n){
  const c=compute(sku), weeks=c.weeks.slice(0,n);
  const byLoc={};
  for(const r of c.rows) byLoc[r.loc.id]=r.ship.slice(0,n);
  return {weeks,byLoc,total:weeks.map((_,k)=>sum(c.rows.map(r=>r.ship[k]||0)))};
}
function backTotal(sku,loc,endWk,n){ return periodTotal(sku,loc,endWk,n)||0; }
function fwdPriorTotal(sku,loc,weeks,off){
  let t=0;
  for(const w of weeks){ const v=outAt(sku,loc,wkAdd(w,-off)); if(v!=null) t+=v; }
  return t;
}

function reviewTrend(pane,sku){
  const end=lastFullWeek(), chans=reviewChannels(sku);
  const s=skus().find(x=>x.id===sku);
  const unit=(PACK_UNIT[s.pack]||"units").toLowerCase();
  const fwdN=Math.min(revFwd,S.config.horizon);
  const fw=forwardView(sku,fwdN);

  const back=[0,52,104].map(off=>
    chans.reduce((a,l)=>a+backTotal(sku,l.id,wkAdd(end,-off),revWeeks),0));
  const fwd=[sum(fw.total),
    chans.reduce((a,l)=>a+fwdPriorTotal(sku,l.id,fw.weeks,52),0),
    chans.reduce((a,l)=>a+fwdPriorTotal(sku,l.id,fw.weeks,104),0)];
  const pc=(a,b)=>{const v=pctChange(a,b);return v==null?"—":(v>=0?"+":"")+v.toFixed(0)+"%";};
  const tone=(a,b)=>{const v=pctChange(a,b);return v==null?"":v>=0?"good":"alert";};

  const t=el("div",{class:"tiles"});
  t.append(tile("Shipped, last "+revWeeks+" wks",n0(back[0]),
    pc(back[0],back[1])+" on last year · "+pc(back[0],back[2])+" on two years",
    tone(back[0],back[1])));
  t.append(tile("Forecast, next "+fwdN+" wks",n0(fwd[0]),
    pc(fwd[0],fwd[1])+" on last year · "+pc(fwd[0],fwd[2])+" on two years",
    tone(fwd[0],fwd[1])));
  /* the sense check: if the year behind is down 11% and the year ahead is up
     20%, the forecast is saying something the trade isn't */
  const bk=pctChange(back[0],back[1]), fd=pctChange(fwd[0],fwd[1]);
  if(bk!=null&&fd!=null){
    const gap=fd-bk;
    t.append(tile("Forecast against the run rate",(gap>=0?"+":"")+gap.toFixed(0)+" pts",
      Math.abs(gap)<8?"in line with how the year has gone"
        :(gap>0?"forecast is more bullish than the year behind it"
               :"forecast is more cautious than the year behind it"),
      Math.abs(gap)<8?"good":"warn"));
  }
  const moves=chans.map(l=>({l,
    now:sum(fw.byLoc[l.id]||[]),then:fwdPriorTotal(sku,l.id,fw.weeks,52)}))
    .map(x=>Object.assign(x,{diff:x.now-x.then})).sort((a,b)=>b.diff-a.diff);
  if(moves.length) t.append(tile("Biggest change ahead",moves[0].l.name,
    (moves[0].diff>=0?"+":"")+n0(moves[0].diff)+" "+unit+" vs last year",
    moves[0].diff>=0?"good":"alert"));
  if(moves.length>1){
    const d=moves[moves.length-1];
    t.append(tile("Biggest fall ahead",d.l.name,
      (d.diff>=0?"+":"")+n0(d.diff)+" "+unit+" vs last year",d.diff>=0?"good":"alert"));
  }
  pane.append(t);

  /* ---- one timeline: the weeks behind, then the weeks ahead ---- */
  const bw=periodWeeks(end,revWeeks), allW=bw.concat(fw.weeks);
  const SM=4;
  const thisYr=smooth(bw.map(w=>weekTotal(sku,chans,w)),SM).concat(fw.weeks.map(()=>null));
  /* the forecast carries on from the last actual so the line doesn't jump */
  const fcRaw=bw.map(()=>null).concat(fw.total);
  const joinFrom=Math.max(0,bw.length-SM);
  for(let i=joinFrom;i<bw.length;i++) fcRaw[i]=weekTotal(sku,chans,bw[i]);
  const fc=smooth(fcRaw,SM).map((v,i)=>i<bw.length-1?null:v);
  const lastYr=smooth(allW.map(w=>weekTotal(sku,chans,wkAdd(w,-52))),SM);
  const twoYr=smooth(allW.map(w=>weekTotal(sku,chans,wkAdd(w,-104))),SM);

  const c=el("div",{class:"card"});
  c.append(el("header",{},el("h3",{},"Shipped a week, against the last two years"),
    el("span",{class:"hint"},SM+"-week average")));
  const body=el("div",{class:"body"});
  body.append(lineChart({
    title:s.product.name+" "+s.pack+" — "+unit+" a week",
    note:"actual to "+fmtD(end)+", forecast after it",
    x:allW.map(w=>fmtW(w)),
    markAt:bw.length-1, markLabel:"forecast →",
    series:[{name:"This year",values:thisYr,color:"var(--viz-1)"},
            {name:"Forecast",values:fc,color:"var(--viz-1)",dash:"5 4"},
            {name:"Last year",values:lastYr,color:"var(--viz-2)"},
            {name:"Two years ago",values:twoYr,color:"var(--viz-3)"}]}));
  c.append(body); pane.append(c);

  /* ---- the same thing per channel, both halves ---- */
  const half=(title,hint,rows,totals)=>{
    const card=el("div",{class:"card"});
    card.append(el("header",{},el("h3",{},title),el("span",{class:"hint"},hint)));
    const w=el("div",{class:"scroll"}), tb=el("table");
    tb.append(el("thead",{},el("tr",{},el("th",{},"Channel"),el("th",{},"Type"),
      el("th",{class:"num"},"This year"),el("th",{class:"num"},"Last year"),
      el("th",{class:"num"},"Two years ago"),el("th",{class:"num"},"vs last year"),
      el("th",{class:"num"},"vs two years"),el("th",{},"Share"))));
    const bd=el("tbody");
    const top=rows.length?Math.max(...rows.map(r=>r.v[0]),1):1;
    const cell=x=>x==null?el("td",{class:"num dim"},"—")
      :el("td",{class:"num",style:"color:"+(x>=0?"var(--ok)":"var(--crit)")},
         (x>=0?"+":"")+x.toFixed(0)+"%");
    for(const {l,v} of rows){
      bd.append(el("tr",{},
        el("td",{},el("b",{},l.name)),
        el("td",{class:"dim"},LOCTYPE[l.type]),
        el("td",{class:"num"},n0(v[0])),
        el("td",{class:"num dim"},n0(v[1])),
        el("td",{class:"num dim"},n0(v[2])),
        cell(pctChange(v[0],v[1])),cell(pctChange(v[0],v[2])),
        el("td",{},el("div",{class:"bar"},el("i",{style:"width:"+(v[0]/top*100)+"%"})))));
    }
    bd.append(el("tr",{class:"tot"},
      el("td",{},el("b",{},"Total")),el("td",{}),
      el("td",{class:"num"},el("b",{},n0(totals[0]))),
      el("td",{class:"num"},n0(totals[1])),el("td",{class:"num"},n0(totals[2])),
      cell(pctChange(totals[0],totals[1])),cell(pctChange(totals[0],totals[2])),
      el("td",{})));
    tb.append(bd); w.append(tb); card.append(w); pane.append(card);
  };
  half("Behind us","the "+revWeeks+" weeks to "+fmtD(end),
    chans.map(l=>({l,v:[0,52,104].map(off=>backTotal(sku,l.id,wkAdd(end,-off),revWeeks))}))
      .sort((a,b)=>b.v[0]-a.v[0]), back);
  half("Ahead of us","the "+fwdN+" weeks from "+fmtD(fw.weeks[0]||end),
    chans.map(l=>({l,v:[sum(fw.byLoc[l.id]||[]),
                        fwdPriorTotal(sku,l.id,fw.weeks,52),
                        fwdPriorTotal(sku,l.id,fw.weeks,104)]}))
      .sort((a,b)=>b.v[0]-a.v[0]), fwd);
}

/* ---------------- how well each basis has predicted ---------------- */
function predictions(sku,loc,wk,avgWin){
  const py=outAt(sku,loc,wkAdd(wk,-52));
  const key=histLoc(sku,"out",loc);
  /* the same seasonal average the forecast runs on, re-predicted from only what
     was known before that week */
  const ra=seasonalMean(sku,"out",key,wk,avgWin);
  return {prior_year:py,recent_avg:ra};
}
function accuracyFor(sku,loc,n,avgWin){
  const end=lastFullWeek(); let act=0,nw=0;
  const err={prior_year:0,recent_avg:0}, cnt={prior_year:0,recent_avg:0};
  const pred={prior_year:0,recent_avg:0};
  for(const w of periodWeeks(end,n)){
    const a=outAt(sku,loc,w); if(a==null) continue;
    act+=a; nw++;
    const p=predictions(sku,loc,w,avgWin);
    for(const k of ["prior_year","recent_avg"]){
      if(p[k]==null) continue;
      pred[k]+=p[k]; err[k]+=Math.abs(p[k]-a); cnt[k]++;
    }
  }
  if(!nw) return null;
  const mk=k=>cnt[k]?{total:pred[k],mae:err[k]/cnt[k],
    bias:act?((pred[k]-act)/act*100):null,weeks:cnt[k]}:null;
  return {actual:act,weeks:nw,prior_year:mk("prior_year"),recent_avg:mk("recent_avg")};
}

function reviewAccuracy(pane,sku){
  const s=skus().find(x=>x.id===sku), end=lastFullWeek();
  const win=S.config.avgWindow||8, chans=reviewChannels(sku);
  const unit=(PACK_UNIT[s.pack]||"units").toLowerCase();
  const agg={actual:0,prior_year:{total:0,err:0,n:0},recent_avg:{total:0,err:0,n:0}};
  const per=[];
  for(const l of chans){
    const a=accuracyFor(sku,l.id,revWeeks,win); if(!a) continue;
    per.push({l,a}); agg.actual+=a.actual;
    for(const k of ["prior_year","recent_avg"]) if(a[k]){
      agg[k].total+=a[k].total; agg[k].err+=a[k].mae*a[k].weeks; agg[k].n+=a[k].weeks;
    }
  }
  const mae=k=>agg[k].n?agg[k].err/agg[k].n:null;
  const better=(mae("prior_year")==null||mae("recent_avg")==null)?null
    :(mae("prior_year")<=mae("recent_avg")?"prior_year":"recent_avg");

  const t=el("div",{class:"tiles"});
  t.append(tile("Actually shipped",n0(agg.actual),unit+", last "+revWeeks+" weeks"));
  for(const k of ["prior_year","recent_avg"]){
    const bias=agg.actual?((agg[k].total-agg.actual)/agg.actual*100):null;
    t.append(tile(BASES[k],mae(k)==null?"—":n0(mae(k))+"/wk",
      bias==null?"average miss":"would have been "+(bias>=0?"+":"")+bias.toFixed(0)+"% over the period",
      better===k?"good":""));
  }
  t.append(tile("Closer over this period",better?BASES[better]:"—",
    better?"on average weekly error":"not enough history"));
  pane.append(t);

  pane.append(el("div",{class:"note"},el("b",{},"How to read this. "),
    "Each past week is re-predicted from what was known before it — same week last year, ",
    "or the ",win,"-week average running into it — and compared with what actually shipped. ",
    "The basis with the smaller average weekly miss is the one worth trusting for this SKU. ",
    "Set it per channel on the Forecast screen."));

  const wks=periodWeeks(end,Math.min(revWeeks,26));
  const sum=(f)=>wks.map(w=>{
    let t2=0,any=false;
    for(const l of chans){ const v=f(l.id,w); if(v!=null){t2+=v;any=true;} }
    return any?t2:null;});
  const c=el("div",{class:"card"});
  c.append(el("header",{},el("h3",{},"Week by week, predicted against actual")));
  const body=el("div",{class:"body"});
  body.append(lineChart({title:s.product.name+" "+s.pack+" — "+unit+" shipped per week",
    note:"predictions use only what was known before each week",
    x:wks.map(w=>fmtW(w)),
    series:[
      {name:"Actual",values:sum((l,w)=>outAt(sku,l,w))},
      {name:"Prior year",dash:"5 4",values:sum((l,w)=>predictions(sku,l,w,win).prior_year)},
      {name:"Recent average",dash:"2 4",values:sum((l,w)=>predictions(sku,l,w,win).recent_avg)}
    ]}));
  c.append(body); pane.append(c);

  const tc=el("div",{class:"card"});
  tc.append(el("header",{},el("h3",{},"Which basis fits each channel"),
    el("span",{class:"hint"},"average weekly miss over "+revWeeks+" weeks")));
  const w2=el("div",{class:"scroll"}), tb=el("table");
  tb.append(el("thead",{},el("tr",{},el("th",{},"Channel"),el("th",{class:"num"},"Shipped"),
    el("th",{class:"num"},"Prior year miss"),el("th",{class:"num"},"Recent average miss"),
    el("th",{},"Closer"),el("th",{},"Set to"))));
  const bd=el("tbody");
  for(const {l,a} of per.sort((x,y)=>y.a.actual-x.a.actual)){
    const p=a.prior_year,r=a.recent_avg;
    const best=(p&&r)?(p.mae<=r.mae?"prior_year":"recent_avg"):(p?"prior_year":r?"recent_avg":null);
    const cur=(planOf(sku).basis||{})[l.id]||S.config.defaultDrawBasis;
    bd.append(el("tr",{class:"stripe "+(best&&cur!==best?"warn":"")},
      el("td",{},el("b",{},l.name)),
      el("td",{class:"num"},n0(a.actual)),
      el("td",{class:"num"+(best==="prior_year"?"":" dim")},p?n0(p.mae)+"/wk":"—"),
      el("td",{class:"num"+(best==="recent_avg"?"":" dim")},r?n0(r.mae)+"/wk":"—"),
      el("td",{},best?el("span",{class:"chip ok"},BASES[best]):el("span",{class:"dim"},"—")),
      el("td",{},cur===best||!best?el("span",{class:"chip"},BASES[cur]||cur)
        :el("button",{class:"btn sm",onclick:()=>{setBasis(sku,l.id,best);
            flash(l.name+" set to "+BASES[best]);}},"Use "+BASES[best].toLowerCase()))));
  }
  tb.append(bd); w2.append(tb); tc.append(w2); pane.append(tc);
}
</script>

      {onchange:e=>{S.config.horizon=+e.target.value;S.calcCache=null;saveConfig();render();}}))));
  sc.append(b);pane.append(sc);

    for(const code of PACKS){
      const q=(rec.packs||[]).find(x=>x.code===code);
      const on=el("input",{type:"checkbox",id:"pk-"+slug(code),checked:!!q});
      const sh=el("input",{type:"number",id:"sh-"+slug(code),value:(q&&q.shelfLifeMonths)||PACK_SHELF[code],
        min:"1",max:"60",style:"width:64px"});
      /* how much beer one of these holds, and how much has to be brewed to
         fill it — the figures the tank timeline and the brew volumes run on */
      const lt=el("input",{type:"number",id:"lt-"+slug(code),step:"0.01",min:"0",style:"width:74px",
        value:(q&&q.litres!=null)?q.litres:(LPU[code]||""),
        title:"Litres in one "+(PACK_UNIT[code]||"unit").toLowerCase()});
      const ef=el("input",{type:"number",id:"ef-"+slug(code),step:"1",min:"1",max:"100",style:"width:64px",
        value:(q&&q.efficiency!=null)?q.efficiency:90,
        title:"How much of what goes into the tank ends up packaged"});
      /* part units: a taproom that pours a quarter keg a week needs 0.25 to
         mean something rather than rounding to nothing */
      const pu=el("input",{type:"checkbox",id:"pu-"+slug(code),
        checked:(q&&q.partUnits!=null)?!!q.partUnits:(code==="Keg"||code==="30L Keg"),
        title:"Allow part units — 0.25 of a keg, say"});
      pk.append(el("div",{class:"row",style:"align-items:center;gap:6px"},
        el("label",{class:"row",style:"align-items:center;gap:7px;min-width:118px"},on,el("span",{},code)),
        el("span",{class:"hint"},"shelf"),sh,el("span",{class:"hint"},"m"),
        el("span",{class:"hint",style:"margin-left:6px"},"litres"),lt,
        el("span",{class:"hint"},"per "+(PACK_UNIT[code]||"unit").toLowerCase().replace(/s$/,"")),
        el("span",{class:"hint",style:"margin-left:6px"},"yield"),ef,el("span",{class:"hint"},"%"),
        el("label",{class:"row",style:"align-items:center;gap:5px;margin-left:8px"},
          pu,el("span",{class:"hint"},"part units"))));
    }
    b.append(pk);
    b.append(el("div",{class:"note"},"Send-by is best before minus half the shelf life set here, ",
      "so a 12-month can can't ship to a distributor with under 6 months left."));
    if(isNew&&S.products.length){
      b.append(field("Copy channels and targets from",
        sel([["","Nothing — I'll choose them later"],
             ...S.products.filter(x=>x.forecast!==false).map(x=>[x.id,x.name])],"",{id:"pcopy"}),
        "Saves setting up every distributor again for a new beer"));
    }
  },body=>{
    const name=$("#pn",body).value.trim();
    if(!name){flash("Give the product a name");return false;}
    rec.name=name; rec.id=rec.id||slug(name);
    rec.brewToPackDays=num($("#pb",body).value)||21;
    rec.forecast=$("#pf",body).value==="yes";
    if($("#pr",body).value==="noncore") rec.range="noncore"; else delete rec.range;
    rec.packs=PACKS.filter(c=>$("#pk-"+slug(c),body).checked).map(c=>({code:c,unitLabel:PACK_UNIT[c],
      shelfLifeMonths:num($("#sh-"+slug(c),body).value)||PACK_SHELF[c],
      litres:num($("#lt-"+slug(c),body).value)||LPU[c]||0,
      efficiency:Math.min(100,Math.max(1,num($("#ef-"+slug(c),body).value)||90)),
      partUnits:$("#pu-"+slug(c),body).checked,
      active:true}));
    rec.colour=$("#pc",body)?$("#pc",body).value:rec.colour;
    if(isNew) S.products.push(rec);
    S.products.sort((a,b2)=>(a.sort|0)-(b2.sort|0));
    persist("products",rec);
    const from=isNew&&$("#pcopy",body)?$("#pcopy",body).value:"";
    if(from){
      let n=0;
      for(const q of rec.packs){
        const src=planOf(from+"__"+slug(q.code)), dst=planOf(rec.id+"__"+slug(q.code));
        if(!S.hist[from+"__"+slug(q.code)]&&!S.plan[from+"__"+slug(q.code)]) continue;
        dst.channels=Array.from(channelsFor(from+"__"+slug(q.code)));
        dst.targetUnits=Object.assign({},src.targetUnits);
        dst.method=Object.assign({},src.method);
        dst.basis=Object.assign({},src.basis);
        persist("plan",dst); n++;
      }
      flash(name+" saved — channels copied to "+n+" pack"+(n===1?"":"s"));
    } else flash(name+" saved");
  });
}
function editTank(t){
  const isNew=!t;
  const rec=t||{name:"",cap:10000};
  openDialog(isNew?"Add tank":"Tank "+rec.name,b=>{
    b.append(el("div",{class:"grid2"},
      field("Name",el("input",{type:"text",id:"tn",value:rec.name,placeholder:"FV-07"})),
      field("Capacity",el("input",{type:"number",id:"tc",value:rec.cap,min:"1",step:"100"}),"Litres")));
    if(!isNew){
      const on=S.runs.filter(x=>x.tank===rec.name&&x.status!=="cancelled").length;
      b.append(el("div",{class:"note"},on?(on+" run"+(on===1?"":"s")+" allocated to this tank. "
        +"Renaming it leaves them pointing at the old name."):"Nothing allocated to this tank."));
      b.append(el("button",{class:"btn danger",type:"button",style:"align-self:flex-start",
        onclick:()=>{S.config.tanks=tanks().filter(x=>x.name!==rec.name);saveConfig();
          $("#dlg").close();render();flash(rec.name+" removed");}},"Remove tank"));
    }
  },body=>{
    const name=$("#tn",body).value.trim(), cap=num($("#tc",body).value)||0;
    if(!name||cap<=0){flash("A tank needs a name and a capacity");return false;}
    const list=tanks().slice();
    const i=list.findIndex(x=>x===t);
    if(i>=0) list[i]={name,cap}; else list.push({name,cap});
    S.config.tanks=list; saveConfig(); flash(name+" saved");
  });
}
function editLocation(l){
  const isNew=!l||!l.id;
  const rec=(l&&l.id)?l:{id:"",name:"",type:"distributor",method:"target_soh",active:true,
    sort:S.locations.length,targetWeeks:3,leadTimeWeeks:1,orderMultiple:1,plannedHorizon:13};
  openDialog(isNew?"Add distributor or channel":"Edit "+rec.name,b=>{
    b.append(el("div",{class:"grid2"},
      field("Name",el("input",{type:"text",id:"ln",value:rec.name,placeholder:"Paramount VIC"})),
      field("Type",sel([["distributor","Distributor — holds our stock"],["retail","Retail chain — holds our stock"],
        ["direct","Direct channel — ships from coldroom"],["internal","Internal (coldroom, quarantine)"]],rec.type,
        {id:"lt",onchange:()=>toggleLoc(b)}))));
    const box=el("div",{id:"lbox",class:"grid2"});
    box.append(field("Replenishment",sel([["target_soh","Top up to a target stock level"],
      ["planned","They send us an order plan"]],rec.method,{id:"lm"}),
      "Order plans are typed straight into the forecast grid"));
    box.append(field("Order plan horizon",el("input",{type:"number",id:"lh",value:rec.plannedHorizon||13,min:"1",max:"52"}),"Weeks"));
    box.append(field("Target cover",el("input",{type:"number",id:"lw",value:rec.targetWeeks||3,min:"0",step:"0.5"}),
      "Weeks of their drawdown to hold in their warehouse"));
    box.append(field("Lead time",el("input",{type:"number",id:"ll",value:rec.leadTimeWeeks||0,min:"0",max:"12"}),"Weeks from order to delivery"));
    box.append(field("Stock on hand",
      sel([["reported","They report it — type it on the forecast"],
           ["counted","We count it on the stocktake sheet"]],
        (rec.reports!=null?!!rec.reports:rec.type==="retail")?"reported":"counted",{id:"lr"}),
      "Reported means their stock on hand is typed into the forecast grid each week, "+
      "and the stocktake sheet leaves them alone"));
    box.append(field("Order multiple",el("input",{type:"number",id:"lo",value:rec.orderMultiple||1,min:"1"}),
      "Round orders up to this — e.g. 144 for a pallet of cans"));
    b.append(box); toggleLoc(b,rec.type);
    if(!isNew) b.append(el("button",{class:"btn danger",type:"button",style:"align-self:flex-start",
      onclick:()=>{if(!confirm("Remove "+rec.name+" from the tool? Stocktake lines against it stay but won't be forecast."))return;
        S.locations=S.locations.filter(x=>x.id!==rec.id);remove("locations",rec.id);$("#dlg").close();render();}},"Remove"));
  },body=>{
    const name=$("#ln",body).value.trim();
    if(!name){flash("Give it a name");return false;}
    rec.name=name; rec.id=rec.id||slug(name); rec.type=$("#lt",body).value;
    rec.method=$("#lm",body).value; rec.plannedHorizon=num($("#lh",body).value)||13;
    rec.targetWeeks=num($("#lw",body).value)||3; rec.leadTimeWeeks=num($("#ll",body).value)||0;
    rec.orderMultiple=num($("#lo",body).value)||1;
    rec.reports=$("#lr",body).value==="reported";
    if(isNew) S.locations.push(rec);
    S.locations.sort((a,b2)=>(a.sort|0)-(b2.sort|0));
    persist("locations",rec); flash(name+" saved");
  });
}
function toggleLoc(b,t){
  const type=t||$("#lt",b).value, tracks=(type==="distributor"||type==="retail");
  $("#lbox",b).style.display=tracks?"grid":"none";
}

/* ---- which distributors and channels a SKU goes to ---- */
function editChannels(sku){
  const pl=planOf(sku.id);
  const chosen=channelsFor(sku.id);
  const explicit=channelsAreExplicit(sku.id);
  const groups=[["distributor","Distributors"],["retail","Retail chains"],["direct","Direct channels"]];
  openDialog("Channels for "+sku.product.name+" "+sku.pack,b=>{
    b.append(el("div",{class:"note"},
      explicit?"These are set for this SKU."
             :"Working this out from history at the moment. Tick or untick anything and it becomes the set list for this SKU.",
      " Unticking a channel takes it out of the forecast; nothing already recorded against it is deleted."));
    for(const [type,label] of groups){
      const list=activeLocs().filter(l=>l.type===type);
      if(!list.length) continue;
      b.append(el("div",{class:"fld"},label));
      const g=el("div",{class:"grid3"});
      for(const l of list){
        const had=skuHasActivity(sku.id,l.id);
        g.append(el("label",{class:"row",style:"align-items:center;gap:7px"},
          el("input",{type:"checkbox",id:"ch-"+l.id,checked:chosen.has(l.id)}),
          el("span",{},l.name),
          had?el("span",{class:"chip ok",title:"Has history for this SKU"},"used"):null));
      }
      b.append(g);
    }
    const m=pl.model;
    b.append(el("div",{class:"row"},
      el("button",{class:"btn",type:"button",
        onclick:()=>{delete pl.channels;persist("plan",pl);$("#dlg").close();render();
          flash("Back to working channels out from history");}},
        "Reset to automatic"),
      el("button",{class:"btn",type:"button",
        onclick:()=>{$("#dlg").close();setTimeout(()=>editModel(sku),60);}},
        m&&m.sku?("Modelled on "+skuLabel(m.sku)+" — change")
                :"Forecast this SKU off another one…")));
  },body=>{
    const picked=activeLocs().filter(l=>{const c=$("#ch-"+l.id,body);return c&&c.checked;}).map(l=>l.id);
    pl.channels=picked;
    persist("plan",pl);
    flash(sku.product.name+" "+sku.pack+" — "+picked.length+" channel"+(picked.length===1?"":"s"));
  },"Save channels");
}

/* ---- the figure a channel gets topped up to ----
   Two ways of saying the same thing: weeks of their own drawdown, which moves
   as they get busier, or a fixed number of units, which doesn't. Weeks is the
   default and comes from the channel's setting in Setup; either can be set for
   one SKU at this channel without touching the rest. */
function editTarget(s,r){
  const pl=planOf(s.id), loc=r.loc.id;
  const locWeeks=(L(loc)||{}).targetWeeks||3;
  const curW=(pl.targetWeeks||{})[loc], curU=(pl.targetUnits||{})[loc];
  const unit=(PACK_UNIT[s.pack]||"units").toLowerCase();
  openDialog("Top-up target — "+s.product.name+" "+s.pack+" at "+r.loc.name,b=>{
    b.append(el("div",{class:"note"},
      "We top this channel up to ",el("b",{},qfmt(s.id)(r.target)+" "+unit),
      " — they draw about ",el("b",{},n0(r.avg)+" "+unit+" a week"),
      ", so that is ",el("b",{},n1(r.avg>0?r.target/r.avg:0)+" weeks")," of cover. ",
      "Leave both boxes empty to follow the channel's own setting of "+n1(locWeeks)+" weeks."));
    b.append(el("div",{class:"grid2"},
      field("Weeks of cover",el("input",{type:"number",id:"tw",step:"0.5",min:"0",
        value:curW!=null?curW:"",placeholder:n1(locWeeks)}),
        "Moves with their drawdown"),
      field("Or a fixed figure",el("input",{type:"number",id:"tu",step:"1",min:"0",
        value:curU!=null&&curU!==""?curU:"",placeholder:"e.g. "+qfmt(s.id)(r.target)}),
        unit.charAt(0).toUpperCase()+unit.slice(1)+" — wins over the weeks")));
    const out=el("div",{class:"hint"},"");
    const redraw=()=>{
      const u=num($("#tu",b).value), w=num($("#tw",b).value);
      const t=(u!=null&&u>0)?u:Math.round(r.avg*(w!=null?w:locWeeks));
      out.textContent="That makes the target "+n0(t)+" "+unit
        +(r.avg>0?" — "+n1(t/r.avg)+" weeks of cover at the moment":"");
    };
    $("#tu",b).addEventListener("input",redraw);
    $("#tw",b).addEventListener("input",redraw);
    redraw(); b.append(out);
    b.append(el("label",{class:"row",style:"align-items:center;gap:8px;margin-top:4px"},
      el("input",{type:"checkbox",id:"tall"}),
      el("span",{},"Apply to every channel on this SKU that tops up to target")));
    if(curW!=null||curU!=null) b.append(el("button",{class:"btn",type:"button",style:"align-self:flex-start",
      onclick:()=>{delete (pl.targetWeeks||{})[loc]; delete (pl.targetUnits||{})[loc];
        persist("plan",pl);$("#dlg").close();render();
        flash("Back to the channel's own setting");}},"Clear — follow the channel setting"));
  },body=>{
    const u=num($("#tu",body).value), w=num($("#tw",body).value);
    const all=$("#tall",body).checked;
    const locs=all?compute(s.id).rows.filter(x=>x.tracks&&x.method==="target_soh").map(x=>x.loc.id):[loc];
    for(const id of locs){
      pl.targetUnits=pl.targetUnits||{}; pl.targetWeeks=pl.targetWeeks||{};
      if(u!=null&&u>0) pl.targetUnits[id]=u; else delete pl.targetUnits[id];
      if(w!=null) pl.targetWeeks[id]=w; else delete pl.targetWeeks[id];
    }
    persist("plan",pl);
    flash(locs.length>1?("Target set on "+locs.length+" channels"):"Target saved");
  },"Save target");
}

/* ---- forecast a new SKU from one that has history ---- */
function editModel(sku){
  const pl=planOf(sku.id), m=pl.model||{};
  const others=skus().filter(x=>x.id!==sku.id&&S.hist[x.id])
    .sort((a,b)=>(a.product.name+a.pack).localeCompare(b.product.name+b.pack));
  openDialog("Model "+sku.product.name+" "+sku.pack+" on another SKU",b=>{
    b.append(el("div",{class:"note"},
      "A new beer has no history to forecast from. Pick one that does and this SKU uses its ",
      el("b",{},"same week last year"),
      " figures, scaled. Any channel still set to prior year or recent average falls back to this ",
      "when it has nothing of its own, and you can set a channel to ",
      el("b",{},"Like another SKU")," to use it outright."));
    b.append(el("div",{class:"grid3"},
      field("Forecast from",sel([["","Nothing — use this SKU's own history"],
        ...others.map(x=>[x.id,x.product.name+" "+x.pack])],m.sku||"",{id:"mk"})),
      field("At",el("input",{type:"number",id:"mp",value:m.pct==null?100:m.pct,min:"1",max:"500"}),
        "% of it — 60 means it sells at 60% the rate"),
      field("Channel",sel([["","Match channel for channel"],
        ...activeLocs().map(l=>[l.id,"Always use "+l.name])],m.loc||"",{id:"ml"}),
        "Where to read that SKU's history from")));
    if(m.sku) b.append(el("button",{class:"btn danger",type:"button",style:"align-self:flex-start",
      onclick:()=>{delete pl.model;persist("plan",pl);$("#dlg").close();render();
        flash("Model removed");}},"Stop modelling"));
  },body=>{
    const src=$("#mk",body).value;
    if(!src){ delete pl.model; persist("plan",pl); flash("Model removed"); return; }
    pl.model={sku:src,pct:num($("#mp",body).value)||100,loc:$("#ml",body).value||null};
    persist("plan",pl);
    flash(sku.product.name+" "+sku.pack+" now forecast from "+skuLabel(src));
  },"Save");
}

/* ============================ go ============================ */
boot();
</script>
