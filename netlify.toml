[build]
  publish = "public"

[functions]
  node_bundler = "esbuild"

# The stock figures are commercial data. Keep the site out of search engines
# even though the URL isn't published anywhere.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/seed.json"
  [headers.values]
    Cache-Control = "no-store"

# The whole app is one HTML file, so a cached copy of it is a cached copy of
# the whole site. Never let a browser hold onto it: every visit checks.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

# The worker that keeps the app opening with no signal. It must never be
# cached, or a stale one keeps serving a stale app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
