<script>
"use strict";
/* ============================ forecast engine ============================ */
/* Rounding a quantity. An order multiple always rounds up to it. Otherwise a
   whole unit, unless the pack is sold in parts — the taproom going through a
   quarter keg a week needs 0.25 to survive, not round away to nothing. */
function roundTo(v,m,part){
  if(m&&m>1) return Math.max(0,Math.ceil(v/m)*m);
  if(part) return Math.max(0,Math.round(v*100)/100);
  return Math.max(0,Math.round(v));
}
/* Can this pack be counted in parts? Kegs can unless a product says otherwise;
   cartons can't unless one says they can. */
function qfmt(skuId){
  const pid=String(skuId||"").split("__")[0];
  const pack=(skus().find(x=>x.id===skuId)||{}).pack;
  return partUnits(pid,pack)?nq:n0;
}
function partUnits(productId,pack){
  const q=packSpec(productId,pack);
  if(q&&q.partUnits!=null) return !!q.partUnits;
  return pack==="Keg"||pack==="30L Keg";
}

/* A new beer has no history of its own, so it can be modelled on one that has:
   same week last year from the reference SKU, scaled, optionally reading a
   different channel. Set per SKU; used explicitly by the "Like another SKU"
   basis, and as the fallback whenever this SKU has nothing of its own. */
function modelAt(sku,field,locId,wk){
  const m=planOf(sku).model;
  if(!m||!m.sku||m.sku===sku||!locId) return null;
  const src=m.loc||locId, pct=(m.pct==null?100:m.pct)/100;
  /* a distributor's drawdown is "used" where the reference SKU has it, else "out" */
  const fields=field==="used"?["used","out"]:field==="out"?["out","used"]:[field];
  for(const f of fields){
    const k=histLoc(m.sku,f,src);
    let v=at(m.sku,f,k,wkAdd(wk,-52));
    if(v==null) v=avgOf(m.sku,f,k,S.config.currentWeek,S.config.avgWindow)||null;
    if(v!=null) return v*pct;
  }
  return null;
}
/* ---- seasonality ----
   A flat average of the last few weeks says December looks like October, which
   for beer in Queensland it does not. Where a SKU and a channel have a year or
   more behind them, each forecast week is scaled by how that week has sat
   against its own year, averaged over however many prior years there are.
   Without that history nothing changes: it stays the plain average. */
const SEASON_BACK=[52,104,156];
/* Within the span of the history a blank week means nothing moved that week,
   not that nobody knows — and a quiet week is part of the season. Outside the
   span there is simply no year to read. */
function seasonVal(sku,field,locKey,wk){
  const h=H(sku);
  if(!h||!h._ix||h._ix[wk]==null) return null;
  const v=at(sku,field,locKey,wk);
  return v==null?0:v;
}
/* Settings chosen by measurement, not taste — see the backtest in the README.
   Shipments are lumpy (one big drop lands in week 47 one year and week 46 the
   next), so the season is read over a wide window and leant on gently. ±6 is
   the narrowest window that scores as well as the widest, so it keeps as much
   of the shape as the data will honestly support. An explicit trend term was
   tried and dropped: extrapolating a slope from lumpy weekly shipments took
   the error from 29% to 43%. */
const SEASON_SMOOTH=6, SEASON_DAMP=0.7, SEASON_AGREE=0.4;

/* The level a week sits against is the year CENTRED on it, not the year as a
   whole. A channel that grew from 12 a week to 67 would otherwise read its own
   growth as a season: every week of the lean year looks like a multiple of that
   year's average. Against a centred year, trend cancels and only the shape of
   the year is left. */
function centredLevel(sku,field,locKey,wk){
  const h=H(sku);
  if(!h) return null;
  const c=h._season||(h._season={});
  const k=field+"|"+locKey+"|"+wk;
  if(k in c) return c[k];
  let t=0,n=0;
  for(let d=-26;d<=25;d++){ const v=seasonVal(sku,field,locKey,wkAdd(wk,d)); if(v!=null){t+=v;n++;} }
  return c[k]=(n>=30?t/n:null);
}
function seasonFactor(sku,field,locKey,wk){
  const fs=[];
  /* a year when this channel was a fraction of its present size has nothing to
     say about its season — that is the business starting up, not a winter */
  const now=centredLevel(sku,field,locKey,wkAdd(S.config.currentWeek,-26));
  for(const back of SEASON_BACK){
    const centre=wkAdd(wk,-back);
    const lvl=centredLevel(sku,field,locKey,centre);
    if(!lvl||lvl<=0) continue;
    if(now&&lvl<now*0.25) continue;
    let t=0,n=0;
    for(let d=-SEASON_SMOOTH;d<=SEASON_SMOOTH;d++){
      const v=seasonVal(sku,field,locKey,wkAdd(centre,d)); if(v!=null){t+=v;n++;} }
    if(n<SEASON_SMOOTH+1) continue;
    fs.push((t/n)/lvl);
  }
  if(!fs.length) return null;
  const m=fs.reduce((a,b)=>a+b,0)/fs.length;
  /* Where the years tell different stories the figure is shrunk towards 1
     rather than thrown away — a noisy channel gets a gentle season, a
     consistent one gets the whole of it. Thrown away meant a dead flat
     forecast, which is what this looked like from the outside. */
  let trust=0.7;                                   /* one year is weak evidence */
  if(fs.length>1){
    const sd=Math.sqrt(fs.reduce((a,f)=>a+(f-m)*(f-m),0)/fs.length);
    trust=1/(1+Math.pow(sd/SEASON_AGREE,2));
  }
  return Math.max(0.2,Math.min(4,1+SEASON_DAMP*trust*(m-1)));
}
/* the recent weeks with their own seasonality taken out, so the level we carry
   forward isn't itself a summer or a winter number */
function deseasonalLevel(sku,field,locKey,endWk,avgWin){
  const v=[];
  for(let i=1;i<=avgWin;i++){
    const w=wkAdd(endWk,-i), x=at(sku,field,locKey,w);
    if(x==null) continue;
    const f=seasonFactor(sku,field,locKey,w);
    v.push(f?x/f:x);
  }
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
}
/* one week's seasonal recent average — shared with the Review backtest so the
   two can't drift apart */
function seasonalMean(sku,field,locKey,wk,avgWin){
  const f=seasonFactor(sku,field,locKey,wk);
  /* the level comes from the weeks before this one — and for a week still
     ahead of us, from the weeks before this one in real life */
  const cw=S.config.currentWeek;
  const lvl=deseasonalLevel(sku,field,locKey,wk>cw?cw:wk,avgWin);
  if(lvl==null) return null;
  return f==null?lvl:lvl*f;
}

function forecastSeries(sku,field,locKey,weeks,basis,manualMap,avgWin,locId,growth){
  const cw=S.config.currentWeek;
  /* "same as last year, but up 15%" — the uplift rides on the prior-year basis
     only, so switching basis never leaves a stray multiplier behind */
  const g=(basis==="prior_year"&&growth!=null&&growth!==100)?growth/100:1;
  const avg=avgOf(sku,field,locKey,cw,avgWin);
  const ownHistory=tail(sku,field,locKey,cw,avgWin).length>0;
  let lvl0;                               /* worked out once per series */
  const seasonal=w=>{
    if(lvl0===undefined) lvl0=deseasonalLevel(sku,field,locKey,cw,avgWin);
    if(lvl0==null) return null;
    const f=seasonFactor(sku,field,locKey,w);
    return f==null?null:lvl0*f;
  };
  /* "Flat number": the last figure typed at or before this week holds, so one
     entry carries forward for good until another is typed over the top of it.
     Weeks before the first entry fall through to the normal bases below, which
     keeps a figure typed further out reading as a step change, not a rewrite
     of everything in front of it. */
  const flatAt=w=>{
    if(!manualMap) return null;
    let bk=null;
    for(const k in manualMap) if(k<=w&&manualMap[k]!=null&&(bk===null||k>bk)) bk=k;
    return bk===null?null:manualMap[bk];
  };
  const pick=w=>{
    if(basis==="manual"&&manualMap&&manualMap[w]!=null) return manualMap[w];
    if(basis==="flat"){ const f=flatAt(w); if(f!=null) return f; }
    if(basis==="model"){ const m=modelAt(sku,field,locId,w); if(m!=null) return m; }
    if(basis==="recent_avg"&&ownHistory){ const s=seasonal(w); return s==null?avg:s; }
    const py=at(sku,field,locKey,wkAdd(w,-52));
    if(py!=null) return py*g;
    const m=modelAt(sku,field,locId,w);     /* nothing of our own for this week */
    if(m!=null) return m;
    return avg;
  };
  return weeks.map(w=>Math.max(0,pick(w)||0));
}

function skuHasActivity(sku,locId){
  const cw=S.config.currentWeek, l=L(locId);
  if(!l) return false;
  for(const f of ["out","used","soh"]){
    const k=histLoc(sku,f,locId);
    if(tail(sku,f,k,cw,10).some(v=>v>0)) return true;
    if(tail(sku,f,k,wkAdd(cw,-40),14).some(v=>v>0)) return true;
  }
  const pl=planOf(sku);
  if(pl.planned[locId]&&Object.values(pl.planned[locId]).some(v=>v>0)) return true;
  if(pl.manual[locId]&&Object.values(pl.manual[locId]).some(v=>v>0)) return true;
  if(openingSOH(sku,locId)>0) return true;
  return false;
}

/* Which distributors and channels this SKU actually goes to. Once someone has
   chosen explicitly, that choice stands; until then it's inferred from history. */
function channelsFor(sku,seen){
  seen=seen||new Set();
  if(seen.has(sku)) return new Set();
  seen.add(sku);
  const pl=planOf(sku);
  if(Array.isArray(pl.channels))
    return new Set(pl.channels.filter(id=>L(id)&&L(id).active!==false));
  const own=activeLocs().filter(l=>skuHasActivity(sku,l.id)).map(l=>l.id);
  if(own.length||!pl.model||!pl.model.sku) return new Set(own);
  return channelsFor(pl.model.sku,seen);   /* brand new: follow what it's modelled on */
}
function channelsAreExplicit(sku){ return Array.isArray(planOf(sku).channels); }
/* has this SKU shipped anywhere in its own right? */
function skuHasOwnHistory(sku){
  const cw=S.config.currentWeek;
  return activeLocs().some(l=>["out","used","soh"].some(f=>
    tail(sku,f,histLoc(sku,f,l.id),cw,12).some(v=>v>0)));
}

/* What a run put in the coldroom: once it's packaged, the figure that counts is
   what actually came off the line, not what was planned. */
function runUnits(r){ const a=num(r.actualUnits); return a!=null?a:(num(r.units)||0); }
function beerInFor(sku,weeks){
  const map={};
  for(const r of S.runs){
    if(skuId(r.productId,r.pack)!==sku) continue;
    if(r.status==="cancelled") continue;
    const w=monday(r.packDate);
    map[w]=(map[w]||0)+runUnits(r);
  }
  return weeks.map(w=>map[w]||0);
}

function compute(sku){
  const cfg=S.config, cw=cfg.currentWeek;
  /* kegs can go out in parts; cartons can't, unless Setup says so */
  const part=partUnits(sku.split("__")[0],(skus().find(x=>x.id===sku)||{}).pack);
  const weeks=[]; for(let i=1;i<=cfg.horizon;i++) weeks.push(wkAdd(cw,i));
  const past=[]; for(let i=cfg.past;i>=0;i--) past.push(wkAdd(cw,-i));
  const pl=planOf(sku);
  const rows=[];
  const chans=channelsFor(sku);
  for(const l of activeLocs()){
    if(!chans.has(l.id)) continue;
    const tracks=(l.type==="distributor"||l.type==="retail");
    const kUsed=histLoc(sku,"used",l.id), kOut=histLoc(sku,"out",l.id), kSoh=histLoc(sku,"soh",l.id);
    const basis=(pl.basis&&pl.basis[l.id])||cfg.defaultDrawBasis;
    const method=(pl.method&&pl.method[l.id])||(tracks?(l.method||cfg.defaultShipMethod):"direct");
    const manual=(pl.manual&&pl.manual[l.id])||{};
    const planned=(pl.planned&&pl.planned[l.id])||{};
    const override=(pl.override&&pl.override[l.id])||{};
    const growth=(pl.growth&&pl.growth[l.id]);

    if(!tracks){
      const ship=forecastSeries(sku,"out",kOut,weeks,basis,manual,cfg.avgWindow,l.id,growth);
      /* this week keeps its plan too: what was typed, or what the forecast says
         for it, until the actual is known */
      const actNow=at(sku,"out",kOut,cw);
      const planNow=num(manual[cw])!=null?num(manual[cw])
        :(forecastSeries(sku,"out",kOut,[cw],basis,manual,cfg.avgWindow,l.id,growth)[0]||0);
      rows.push({loc:l,tracks:false,basis,method:"direct",ship,draw:null,soh:null,manual,growth,
        planNow,outNow:actNow!=null?actNow:planNow,
        pastOut:past.map(w=>at(sku,"out",kOut,w)),
        avg:avgOf(sku,"out",kOut,cw,cfg.avgWindow)});
      continue;
    }
    /* distributor / retail: their drawdown drives their SOH, we replenish */
    let drawKey=kUsed, drawField="used";
    if(!tail(sku,"used",kUsed,cw,12).length){ drawKey=kOut; drawField="out"; }
    /* nothing of our own to go on: match whichever series the reference SKU keeps,
       so a modelled drawdown is compared against a drawdown */
    if(pl.model&&pl.model.sku&&!tail(sku,drawField,drawKey,cw,12).length){
      const msrc=pl.model.loc||l.id;
      if(tail(pl.model.sku,"used",histLoc(pl.model.sku,"used",msrc),cw,12).length) drawField="used";
    }
    const draw=forecastSeries(sku,drawField,drawKey,weeks,basis,manual,cfg.avgWindow,l.id,growth);
    const avgDraw=Math.max(0,avgOf(sku,drawField,drawKey,cw,cfg.avgWindow)||sum(draw)/Math.max(1,draw.length));
    const tW=(pl.targetWeeks&&pl.targetWeeks[l.id])!=null?pl.targetWeeks[l.id]:(l.targetWeeks||3);
    const tU=(pl.targetUnits&&pl.targetUnits[l.id]);
    const target=Math.max(0,(tU!=null&&tU!==""&&num(tU)>0)?num(tU):Math.round(avgDraw*tW));
    const lead=Math.max(0,l.leadTimeWeeks||0);
    const mult=l.orderMultiple||1;
    /* An order plan only runs as far as the chain has actually told us —
       their horizon, 13 weeks by default, set per channel in Setup. Figures
       beyond that are guesswork, so the channel goes back to topping up to
       target there. A gap inside the plan is still a deliberate zero; a run of
       zeros on the end is the plan having finished, not an order for none. */
    let lastPlanned="";
    for(const w of Object.keys(planned)) if(num(planned[w])>0&&w>lastPlanned) lastPlanned=w;
    if(method==="planned"){
      const horizonEnd=wkAdd(cw,Math.max(1,l.plannedHorizon||13));
      if(!lastPlanned||lastPlanned>horizonEnd) lastPlanned=horizonEnd;
    }
    /* what we ship in week k lands on their shelf `lead` weeks later */
    let soh=openingSOH(sku,l.id);
    /* This week is still being decided, so it keeps its plan rather than going
       blank: what actually shipped if that has been entered, otherwise their
       order plan, a known order, or topping up to target against what they are
       holding now. The coldroom reads the same figure, so the week it is
       sitting in adds up on screen. */
    const actNow=at(sku,"out",kOut,cw);
    let planNow;
    if(method==="planned") planNow=num(planned[cw])!=null?num(planned[cw]):0;
    else if(num(override[cw])!=null) planNow=num(override[cw]);
    else if(method==="direct") planNow=num(manual[cw])!=null?num(manual[cw]):0;
    else planNow=soh<target?roundTo(target-soh,mult,part):0;
    const sohArr=[],shipArr=[];
    for(let k=0;k<weeks.length;k++){
      const arriving = k>=lead ? shipArr[k-lead]
        : (at(sku,"out",kOut,wkAdd(cw,1+k-lead))||0);
      soh = soh + arriving - draw[k];
      let ship=0;
      const ov=num(override[weeks[k]]);
      const onPlan=method==="planned"&&weeks[k]<=lastPlanned;
      if(onPlan){ ship=num(planned[weeks[k]])||0; }   /* their order plan stands, zeros included */
      else if(ov!=null){ ship=ov; }          /* we already know what's going */
      else {
        /* Top up to target against what they are holding now: target less their
           stock on hand this week, which is last week's stock plus whatever
           landed, less the week's drawdown. The shipment still takes `lead`
           weeks to arrive, so it lands against a week more drawdown — that gap
           is what the target's cover is for, rather than something to inflate
           the order with. */
        if(soh<target) ship=roundTo(target-soh,mult,part);
      }
      sohArr.push(soh); shipArr.push(ship);
    }
    rows.push({loc:l,tracks:true,basis,method,draw,ship:shipArr,soh:sohArr,target,avg:avgDraw,growth,
      planned,override,lastPlanned:method==="planned"?(lastPlanned||null):null,
      planNow,outNow:actNow!=null?actNow:planNow,
      opening:openingSOH(sku,l.id),
      pastOut:past.map(w=>at(sku,"out",kOut,w)),
      pastRet:past.map(w=>at(sku,"ret",l.id,w)),
      pastDraw:past.map(w=>at(sku,drawField,drawKey,w)),
      /* this week's cell falls back to the carried-forward estimate, so the row
         doesn't go blank on a channel nobody counts */
      pastSoh:past.map(w=>{const v=at(sku,"soh",kSoh,w);
        return v!=null?v:(w>=cw?estimateSOH(sku,l.id,w):null);})});
  }
  const totalShip=weeks.map((_,k)=>sum(rows.map(r=>r.ship[k]||0)));
  const beerIn=beerInFor(sku,weeks);
  const openCold=openingSOH(sku,"coldroom");
  /* The coldroom is counted on Monday morning, so this week's packaging and this
     week's shipments still sit between the count and the first forecast week.
     Leave them out and every projection runs a week flattering. */
  const inNow=beerInFor(sku,[cw])[0]||0;
  /* this week's shipments: the actual where it has been entered, the plan
     where it hasn't — so the coldroom isn't flattered by a week nobody has
     typed up yet */
  const outNow=sum(rows.map(r=>r.outNow||0))
    +sum(activeLocs().filter(l=>!rows.some(r=>r.loc.id===l.id))
      .map(l=>at(sku,"out",histLoc(sku,"out",l.id),cw)||0));
  /* stock that came back to us this week is back on the floor to sell */
  const backNow=at(sku,"stockIn","returned",cw)||0;
  /* both ends of each week: what's in the coldroom on the Monday, and what's
     left after that week's packaging and shipments. The pair is what says
     whether a week can be got through, not just which week ends short. */
  /* anything moved in or out by hand: this week's lands before the first
     forecast week, the rest sit in the week they are dated */
  const adjNow=adjustAt(sku,cw);
  const adjFwd=weeks.map(w=>adjustAt(sku,w));
  const cold=[], coldStart=[]; let c=openCold+inNow+backNow+adjNow-outNow;
  for(let k=0;k<weeks.length;k++){ coldStart.push(c); c=c+beerIn[k]+adjFwd[k]-totalShip[k]; cold.push(c); }
  const wkAvg=sum(totalShip)/Math.max(1,totalShip.length);
  const cover=cold.map(v=>wkAvg>0?v/wkAvg:null);
  let stockoutWeek=null;
  for(let k=0;k<weeks.length;k++) if(cold[k]<0){stockoutWeek=weeks[k];break;}
  const p=P(sku.split("__")[0]);
  const lead=(p&&p.brewToPackDays)||21;
  const brewBy=stockoutWeek?iso(new Date(D(stockoutWeek)-lead*DAY)):null;
  const surplusTarget=(p&&p.surplusTarget&&p.surplusTarget[sku.split("__").slice(1).join("__")])||null;
  return {sku,weeks,past,rows,totalShip,beerIn,cold,coldStart,cover,openCold,inNow,outNow,backNow,
    adjNow,adjFwd,pastAdj:past.map(w=>adjustAt(sku,w)||null),
    stockoutWeek,brewBy,wkAvg,surplusTarget,
    pastBack:past.map(w=>at(sku,"stockIn","returned",w)),
    pastRetTotal:past.map(w=>{const t=sum(activeLocs().map(l=>at(sku,"ret",l.id,w)||0));return t||null;}),
    pastTotalOut:past.map(w=>sum(activeLocs().map(l=>at(sku,"out",histLoc(sku,"out",l.id),w)||0))),
    pastCold:past.map(w=>at(sku,"soh","coldroom",w)),
    pastIn:past.map(w=>at(sku,"stockIn","packaged",w))};
}
function computeAll(){
  if(S.calcCache) return S.calcCache;
  const m={}; for(const s of skus()){ if(s.product.forecast===false&&!S.open[s.id]) continue; m[s.id]=compute(s.id); }
  S.calcCache=m; return m;
}

/* ============================ batch ageing ============================ */
function latestStocktake(){ return S.stock.find(s=>s.weekStart<=S.config.currentWeek)||S.stock[0]||null; }
function shelfMonths(productId,pack){
  const p=P(productId); const q=p&&(p.packs||[]).find(x=>x.code===pack);
  return (q&&q.shelfLifeMonths)||PACK_SHELF[pack]||12;
}
function ageRows(){
  const st=latestStocktake(); if(!st) return [];
  const today=S.config.currentWeek;
  return (st.entries||[]).filter(e=>e.qty>0).map(e=>{
    const sm=shelfMonths(e.productId,e.pack);
    const bb=e.bestBefore||null;
    const packDate=e.packDate||(bb?addMonths(bb,-sm):null);
    const sendByD=bb?iso(new Date(D(bb)-Math.round(sm/2*30.44)*DAY)):null;
    const dBB=bb?dDiff(today,bb):null;
    const dSB=sendByD?dDiff(today,sendByD):null;
    const pctLeft=(bb&&packDate)?Math.max(0,Math.min(1,dDiff(today,bb)/Math.max(1,dDiff(packDate,bb)))):null;
    let status="ok";
    if(dBB!=null&&dBB<=0) status="expired";
    else if(dSB!=null&&dSB<=0) status="pastsend";
    else if(dSB!=null&&dSB<=28) status="soon";
    return {...e,shelfMonths:sm,packDate,bestBefore:bb,sendBy:sendByD,daysToBB:dBB,daysToSend:dSB,
      pctLeft,status,weekStart:st.weekStart};
  }).sort((a,b)=>(a.daysToSend==null?1e9:a.daysToSend)-(b.daysToSend==null?1e9:b.daysToSend));
}

/* ============================ headline numbers ============================ */
function alerts(){
  const all=computeAll(), out=[];
  for(const s of skus()){
    if(s.product.forecast===false) continue;
    const c=all[s.id]; if(!c) continue;
    if(c.stockoutWeek){
      const wks=wkDiff(S.config.currentWeek,c.stockoutWeek);
      out.push({sku:s.id,name:s.product.name+" "+s.pack,week:c.stockoutWeek,weeks:wks,brewBy:c.brewBy,
        sev:wks<=4?"crit":wks<=10?"warn":"ok"});
    }
  }
  return out.sort((a,b)=>a.weeks-b.weeks);
}
</script>
<script>
"use strict";
/* ============================ nav / router ============================ */
const ICONS={
 forecast:'<path d="M3 3v18h18"/><path d="M7 14l4-5 3 3 5-7"/>',
 stocktake:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
 production:'<path d="M4 20V9l5 3V9l5 3V4l6 3v13z"/>',
 ageing:'<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',
 review:'<path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l4-6 3 3 4-6"/>',
 noncore:'<path d="M12 3l2.4 5.3 5.6.6-4.2 3.9 1.2 5.6L12 15.6 6.9 18.4l1.2-5.6L4 8.9l5.6-.6z"/>',
 setup:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/>'};
const VIEWS=[
 {id:"forecast",label:"Forecast",title:"Forecast",sub:"Monday afternoon: what's going out this week, and the weeks after it"},
 {id:"noncore",label:"Non-core",title:"Non-core range",sub:"Seasonals, one-offs and anything that isn't part of the core range"},
 {id:"stocktake",label:"Stocktake",title:"Weekly stocktake",sub:"Batch-level counts by location — the numbers everything else runs on"},
 {id:"production",label:"Production",title:"Production schedule",sub:"Planned packaging runs and the brew dates they imply"},
 {id:"ageing",label:"Aged stock",title:"Aged stock",sub:"Best before, send-by cut-offs and what needs moving"},
 {id:"review",label:"Review",title:"Review",sub:"This year against the last two, and how well each forecast basis has held up"},
 {id:"setup",label:"Setup",title:"Setup",sub:"Products, packs, distributors and customer channels"}];

function drawNav(){
  const n=clear($("#nav")), a=alertsSafe();
  const aged=S.ready?ageRows().filter(r=>r.status==="expired"||r.status==="pastsend").length:0;
  for(const v of VIEWS){
    const b=el("button",{"aria-current":String(S.view===v.id),onclick:()=>go(v.id)},
      el("span",{html:'<svg viewBox="0 0 24 24">'+ICONS[v.id]+'</svg>'}).firstChild, v.label);
    /* the run-dry count on each forecast tab counts only that tab's beers */
    if(v.id==="forecast"||v.id==="noncore"){
      const ids=new Set(skusInRange(v.id==="noncore"?"noncore":"core").map(s=>s.id));
      const n=a.filter(x=>x.sev==="crit"&&ids.has(x.sku)).length;
      if(n) b.append(el("span",{class:"ct"},String(n)));
    }
    if(v.id==="ageing"&&aged) b.append(el("span",{class:"ct"},String(aged)));
    n.append(b);
  }
}
function alertsSafe(){ try{ return S.ready?alerts():[]; }catch(e){ return []; } }
/* changing screens starts at the top, so nothing from the last one is put back */
function go(v){ S.view=v; _fresh=true; _uiSeq++; render(); _fresh=false; window.scrollTo(0,0); }

/* Typing a figure redraws the screen, and a redraw used to throw away where
   you were — the page jumped back to the top, the sideways scroll went with
   it and the cell you had just tabbed into lost focus. Every editable cell
   carries a key, so the page, each scroll box and the caret can all be put
   back exactly where they were. */
/* where in the pane something sits, for anything without a key of its own —
   a dropdown, a button — since the screen is rebuilt the same way each time */
function uiPath(n){
  const pane=$("#pane"), p=[];
  while(n&&n!==pane&&n.parentNode){
    p.push([].indexOf.call(n.parentNode.children,n));
    n=n.parentNode;
  }
  return n===pane?p.reverse():null;
}
function uiAt(p){
  let n=$("#pane");
  for(const i of p){ n=n&&n.children[i]; if(!n) return null; }
  return n;
}
let _fresh=false, _uiSeq=0;
function uiState(){
  if(_fresh) return null;
  const a=document.activeElement, inPane=a&&$("#pane")&&$("#pane").contains(a);
  const st={y:window.scrollY,
            k:inPane&&a.getAttribute?a.getAttribute("data-k"):null,
            path:null,sel:null,box:[]};
  if(inPane&&a!==document.body){
    st.path=uiPath(a);
    if(a.selectionStart!=null) st.sel=[a.selectionStart,a.selectionEnd];
  }
  for(const d of document.querySelectorAll("#pane .scroll")) st.box.push([d.scrollLeft,d.scrollTop]);
  return st;
}
function uiRestore(st){
  if(!st) return;
  /* the boxes are put back twice: once now, and once the browser has settled
     the table's width, which it may not have done at the first attempt */
  const seq=++_uiSeq;
  const boxes=()=>document.querySelectorAll("#pane .scroll");
  const scrolls=()=>{
    const bs=boxes();
    for(let i=0;i<bs.length;i++){
      const p=st.box[i]; if(!p) continue;
      if(p[0]&&bs[i].scrollLeft!==p[0]) bs[i].scrollLeft=p[0];
      if(p[1]&&bs[i].scrollTop!==p[1]) bs[i].scrollTop=p[1];
    }
  };
  scrolls();
  let n=null;
  if(st.k) n=$('#pane [data-k="'+st.k.replace(/"/g,"")+'"]');
  if(!n&&st.path) n=uiAt(st.path);
  if(n&&n.focus&&n!==document.activeElement){
    try{ n.focus({preventScroll:true}); }catch(e){ n.focus(); }
  }
  if(n&&st.sel&&n.setSelectionRange){ try{ n.setSelectionRange(st.sel[0],st.sel[1]); }catch(e){} }
  syncNew();
  window.scrollTo(0,st.y);
  requestAnimationFrame(()=>{ if(seq!==_uiSeq) return; scrolls(); syncNew(); window.scrollTo(0,st.y); });
}
/* A cell's change event fires while the focus is still moving to the next one,
   so the redraw waits a tick — by then the new cell is focused and can be
   found again after the rebuild. */
let _pending=0;
function reflow(){
  if(_pending) return;
  _pending=setTimeout(()=>{_pending=0;render();},0);
}

function render(){
  const ui=uiState();
  const v=VIEWS.find(x=>x.id===S.view)||VIEWS[0];
  $("#ttl").textContent=v.title;
  $("#sub").textContent=v.sub;
  $("#curWeek").textContent=fmtWY(S.config.currentWeek);
  const st0=latestStocktake(), gap=st0?wkDiff(st0.weekStart,S.config.currentWeek):null;
  const cw=$("#curWeek").parentNode;
  let note=$("#stGap"); if(!note){note=el("div",{id:"stGap",class:"hint"});cw.append(note);}
  note.textContent=!st0?"no stocktake yet"
    :gap<=0?"counted this week"
    :gap===1?"counted last week":("counted "+gap+" weeks ago");
  note.style.color=gap>1?"var(--warn)":"var(--faint)";
  drawNav();
  const pane=clear($("#pane")), ctl=clear($("#topctl"));
  if(S.seedUpdate) pane.append(seedBanner());
  try{
    ({forecast:viewForecast,noncore:viewForecast,stocktake:viewStocktake,
      production:viewProduction,ageing:viewAgeing,review:viewReview,
      setup:viewSetup}[S.view])(pane,ctl,v);
  }catch(e){
    console.error(e);
    pane.append(el("div",{class:"card"},el("div",{class:"empty"},
      el("b",{},"Something went wrong drawing this screen"),String(e&&e.message||e))));
  }
  uiRestore(ui);
}

function seedBanner(){
  const m=S.seedUpdate, c=m.counts||{};
  const bar=el("div",{class:"card",style:"border-color:var(--warn);margin-bottom:14px"});
  const body=el("div",{class:"body",style:"display:flex;gap:12px;align-items:center;flex-wrap:wrap"});
  body.append(el("div",{style:"flex:1;min-width:280px"},
    el("b",{},"This deploy has newer data than the site is showing. "),
    el("span",{class:"dim"},"Built "+fmtD((m.generated||"").slice(0,10))+
      (c.runs!=null?" · "+c.runs+" packaging runs, "+(c.stocktakes||0)+" stocktakes":"")+
      ". Stock data lives in the site's store, so a deploy doesn't load itself.")));
  const st=el("span",{class:"hint"},"");
  const go=el("button",{class:"btn pri",onclick:async()=>{
    go.disabled=true; st.textContent="Importing…";
    try{
      const n=await importSeed((d,t)=>{st.textContent="Writing "+d+" of "+t+"…";});
      st.textContent="Imported "+n+" records. Reloading…";
      setTimeout(()=>location.reload(),500);
    }catch(e){ go.disabled=false; st.textContent="That didn't work: "+e.message; }
  }},"Import it now");
  body.append(go,st,el("button",{class:"btn",onclick:()=>{S.seedUpdate=null;render();}},"Not now"));
  bar.append(body); return bar;
}

/* ---- a colour per brand ----
   One colour for the beer, not for each pack of it, so Larry is the same
   colour wherever it appears — the forecast, the stocktake, the tank
   timeline. Set in Setup; until one is chosen the name picks a stable colour
   of its own, so nothing is ever grey-on-grey by accident. */
function brandColour(productId){
  const p=P(productId);
  /* an earlier build kept a colour per pack: take the first one it has */
  let set=p&&p.colour;
  if(set&&typeof set==="object") set=Object.values(set).filter(Boolean)[0];
  if(set) return set;
  let n=0; for(const ch of String(productId||"")) n=(n*31+ch.charCodeAt(0))&0xffff;
  const h=n%360;
  const f=v=>Math.round(v).toString(16).padStart(2,"0");
  /* a fixed saturation and lightness keeps the whole set readable together */
  const a=0.52, l=0.56, k=q=>(q+h/30)%12,
        m=q=>l-a*Math.min(l,1-l)*Math.max(-1,Math.min(k(q)-3,Math.min(9-k(q),1)));
  return "#"+f(m(0)*255)+f(m(8)*255)+f(m(4)*255);
}
/* most callers hold a sku id; the brand is its first half */
function skuColour(skuId){ return brandColour(String(skuId||"").split("__")[0]); }
function swatch(skuId){
  return el("span",{class:"sw",style:"background:"+skuColour(skuId),
    title:"Brand colour — set it in Setup"});
}
function skuLabel(id){
  const s=skus().find(x=>x.id===id);
  if(s) return s.product.name+" "+s.pack;
  const h=S.hist[id];
  return h?(h.productName+" "+h.pack):id;
}

/* ============================ shared bits ============================ */
function packFilterCtl(ctl,key){
  const packs=["all",...PACKS.filter(p=>skus().some(s=>s.pack===p))];
  const seg=el("div",{class:"packtabs"});
  for(const p of packs) seg.append(el("button",{"aria-pressed":String(S[key]===p),
    onclick:()=>{S[key]=p;render();}}, p==="all"?"All packs":p));
  ctl.append(seg);
}
function tile(k,v,note,cls){return el("div",{class:"tile "+(cls||"")},el("div",{class:"k"},k),
  el("div",{class:"v"},v),note?el("div",{class:"n"},note):null);}

function openDialog(title,buildBody,onSave,saveLabel){
  const dlg=$("#dlg"), f=clear($("#dlgform"));
  f.append(el("header",{},el("h3",{},title)));
  const body=el("div",{class:"body"}); buildBody(body); f.append(body);
  const foot=el("footer",{});
  foot.append(el("button",{class:"btn",type:"button",onclick:()=>dlg.close()},"Cancel"));
  if(onSave) foot.append(el("button",{class:"btn pri",type:"button",onclick:()=>{
    if(onSave(body)!==false){dlg.close();render();}}},saveLabel||"Save"));
  f.append(foot); dlg.showModal();
}
function field(label,input,hint){return el("label",{class:"fld"},label,input,hint?el("span",{class:"hint"},hint):null);}
function sel(opts,value,attrs){const s=el("select",attrs||{});
  for(const [v,t] of opts) s.append(el("option",{value:v,selected:String(v)===String(value)},t));return s;}

/* ============================ 1. FORECAST ============================ */
function viewForecast(pane,ctl){
  const all=computeAll();
  const which=rangeOfView(), mine=skusInRange(which);
  const ids=new Set(mine.map(s=>s.id));
  const a=alertsSafe().filter(x=>ids.has(x.sku));
  if(which==="noncore") ctl.append(el("button",{class:"btn",
    title:"Choose which beers sit in the non-core range",
    onclick:editRange},"Choose the range"));
  ctl.append(el("span",{class:"hint"},"Horizon"));
  ctl.append(sel([[13,"13 weeks"],[26,"26 weeks"],[52,"52 weeks"]],S.config.horizon,
    {onchange:e=>{S.config.horizon=+e.target.value;S.calcCache=null;saveConfig();render();}}));
  packFilterCtl(ctl,"packTab");
  ctl.append(el("button",{class:"btn",onclick:()=>{
    const open=Object.values(S.open).some(Boolean);
    S.open={}; if(!open) for(const s of visibleSkus()) S.open[s.id]=true; render();
  }},"Expand / collapse"));

  const crit=a.filter(x=>x.sev==="crit"), warn=a.filter(x=>x.sev==="warn");
  const t=el("div",{class:"tiles"});
  t.append(tile(which==="noncore"?"Non-core SKUs":"Core SKUs",String(mine.length),
    mine.filter(s=>s.product.forecast!==false).length+" forecast"));
  t.append(tile("Run dry ≤ 4 weeks",String(crit.length),crit.length?crit.slice(0,2).map(x=>x.name).join(", "):"Nothing urgent",crit.length?"alert":"good"));
  t.append(tile("Run dry ≤ 10 weeks",String(warn.length),"Plan packaging now",warn.length?"warn":""));
  const nextRun=S.runs.filter(r=>r.packDate>=S.config.currentWeek&&r.status!=="cancelled"
      &&ids.has(skuId(r.productId,r.pack)))
    .sort((x,y)=>x.packDate<y.packDate?-1:1)[0];
  t.append(tile("Next packaging run",nextRun?fmtD(nextRun.packDate):"—",
    nextRun?(P(nextRun.productId)||{}).name+" "+nextRun.pack:"Nothing scheduled"));
  const st=latestStocktake();
  t.append(tile("Last stocktake",st?fmtD(st.weekStart):"—",st?(st.entries||[]).length+" batch lines":"Add one to start"));
  pane.append(t);

  /* the projected stock-out table lived here; the tiles above carry the same
     warning and the per-SKU cards carry the detail, so it was removed */

  const vis=visibleSkus();
  if(!vis.length) pane.append(el("div",{class:"card"},el("div",{class:"empty"},
    which==="noncore"
      ?el("b",{},"Nothing in the non-core range yet")
      :el("b",{},"No products yet"),
    which==="noncore"
      ?el("div",{},"Put the seasonals and one-offs here and they come off the main forecast. ",
         el("button",{class:"btn pri",style:"margin-top:10px",onclick:editRange},"Choose the range"))
      :"Add products and packs in Setup, then enter a stocktake.")));
  for(const s of vis){ const c=all[s.id]||compute(s.id); pane.append(skuGrid(s,c)); }
}
/* ---- core and non-core ----
   The core range is the beer that is always on; everything else — seasonals,
   one-offs, the odd collaboration — lives on its own screen so it doesn't
   crowd the weekly decisions. A product says which it is; anything unmarked is
   core, so nothing moves until it's put somewhere. */
const isNonCore=p=>!!p&&p.range==="noncore";
function rangeOfView(){ return S.view==="noncore"?"noncore":"core"; }
function skusInRange(which){
  return skus().filter(s=>isNonCore(s.product)===(which==="noncore"));
}
/* Every SKU's grid shares one week axis, so they share one sideways position:
   scroll any of them and the rest follow, and the same column is the same week
   all the way down the page. */
let syncing=false, syncLeft=0;
function syncAcross(from){
  if(syncing) return;
  syncing=true;
  syncLeft=from.scrollLeft;
  for(const d of document.querySelectorAll("#pane .scroll.wklock"))
    if(d!==from&&d.scrollLeft!==syncLeft) d.scrollLeft=syncLeft;
  requestAnimationFrame(()=>{syncing=false;});
}
/* a grid drawn after the others starts where they are */
function syncNew(){
  if(!syncLeft) return;
  for(const d of document.querySelectorAll("#pane .scroll.wklock"))
    if(d.scrollLeft!==syncLeft) d.scrollLeft=syncLeft;
}
function visibleSkus(){
  const which=rangeOfView();
  return skusInRange(which)
    .filter(s=>S.packTab==="all"||s.pack===S.packTab)
    /* a stock-only beer is hidden from the main forecast, but showing it is the
       whole point of the non-core screen */
    .filter(s=>which==="noncore"||s.product.forecast!==false||S.open[s.id]);
}

function skuGrid(s,c){
  const F=qfmt(s.id);
  const wrap=el("div",{class:"gridwrap",id:"sku-"+s.id,"data-open":String(!!S.open[s.id])});
  const sev=c.stockoutWeek?(wkDiff(S.config.currentWeek,c.stockoutWeek)<=4?"crit":"warn"):"ok";
  const head=el("header",{onclick:()=>{S.open[s.id]=!S.open[s.id];render();}},
    el("span",{html:'<svg class="caret" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>'}).firstChild,
    swatch(s.id),
    el("h3",{},s.product.name,el("span",{},s.pack)),
    el("span",{class:"chip "+(sev==="crit"?"crit":sev==="warn"?"warn":"ok")},
      c.stockoutWeek?("Runs out "+fmtD(c.stockoutWeek)):"Covered "+S.config.horizon+" wks"),
    el("span",{class:"chip"},"Coldroom "+F(c.openCold)+" "+(PACK_UNIT[s.pack]||"").toLowerCase()),
    el("span",{class:"chip"},(c.cover[0]!=null?n1(c.cover[0]):"—")+" wks cover"),
    el("span",{class:"spacer",style:"flex:1"}),
    el("span",{class:"hint"},n0(c.wkAvg)+"/wk out"),
    el("button",{class:"btn sm",title:"Choose which distributors and channels this SKU goes to",
      onclick:ev=>{ev.stopPropagation();editChannels(s);}},
      c.rows.length+" channel"+(c.rows.length===1?"":"s")),
    (()=>{const n=c.rows.filter(r=>r.basis==="prior_year").length;
      if(!n) return null;
      const g=planOf(s.id).growth||{};
      const set=c.rows.filter(r=>r.basis==="prior_year"&&g[r.loc.id]!=null&&g[r.loc.id]!==100);
      return el("button",{class:"btn sm",style:"margin-left:6px",
        title:"Forecast last year up or down by a percentage",
        onclick:ev=>{ev.stopPropagation();editGrowth(s);}},
        set.length?("vs last yr "+(set.length===1?n0(set[0].growth)+"%"
          :set.length+" set")):"vs last yr");})(),
    (()=>{const n=adjustments(s.id).length;
      return el("button",{class:"btn sm",style:"margin-left:6px",
        title:"Move stock in or out by hand, or record a repack",
        onclick:ev=>{ev.stopPropagation();editAdjust(s);}},
        n?(n+" adjustment"+(n===1?"":"s")):"Adjust stock");})(),
    (()=>{const bl=planOf(s.id).batches||{};
      const n=Object.values(bl).reduce((a,w)=>a+Object.keys(w||{}).length,0);
      return el("button",{class:"btn sm",style:"margin-left:6px",
        title:"What each distributor is holding, worked out from the batches we sent and first-in-first-out",
        onclick:ev=>{ev.stopPropagation();viewBatches(s);}},
        n?("batches · "+n+" load"+(n===1?"":"s")):"Batches");})(),
    (()=>{const n=Object.keys(planOf(s.id).notes||{}).length;
      return el("button",{class:"btn sm",style:"margin-left:6px",
        title:"Notes on cells — a PO against an order, an event. Right-click any cell to leave one.",
        onclick:ev=>{ev.stopPropagation();listNotes(s);}},
        n?(n+" note"+(n===1?"":"s")):"Notes");})(),
    (()=>{const n=returnsOf(s.id).length;
      return el("button",{class:"btn sm",style:"margin-left:6px",
        title:"Record stock sent back from a distributor, and where it ended up",
        onclick:ev=>{ev.stopPropagation();editReturns(s,null);}},
        n?(n+" return"+(n===1?"":"s")):"Returns");})(),
    (()=>{if(!typedEntries(s.id,null).length) return null;
      const n=typedCount(s.id);
      return el("button",{class:"btn sm",style:"margin-left:6px",
        title:"Clear typed figures in bulk and hand those weeks back to the forecast",
        onclick:ev=>{ev.stopPropagation();clearTyped(s);}},
        n?(n+" typed over"):"Typed figures");})(),
    (()=>{const m=planOf(s.id).model;
      /* only worth offering where there's no history to forecast from, or one is already set */
      if(!(m&&m.sku)&&skuHasOwnHistory(s.id)) return null;
      return el("button",{class:"btn sm",style:"margin-left:6px",
        title:"Forecast this SKU from another one's history — for a beer with no history of its own",
        onclick:ev=>{ev.stopPropagation();editModel(s);}},
        m&&m.sku?("like "+skuLabel(m.sku)+(m.pct!=null&&m.pct!==100?" "+m.pct+"%":"")):"Model on…");})());
  wrap.append(head);
  if(!S.open[s.id]) return wrap;

  if(!c.rows.length){
    wrap.append(el("div",{class:"empty"},
      el("b",{},"No channels chosen for "+s.product.name+" "+s.pack),
      el("div",{},"Pick the distributors and channels it goes to and the forecast fills in."),
      el("button",{class:"btn pri",style:"margin-top:12px",onclick:()=>editChannels(s)},
        "Choose channels")));
    return wrap;
  }
  const axis=[...c.past,...c.weeks], cwIdx=c.past.length-1;
  /* "tall" bounds the height so the week row has something to stick to: a
     short SKU is unaffected, a long one scrolls inside its own card with its
     dates and channel names staying put. "sync" keeps every SKU on the same
     week, so scrolling one grid sideways moves them all and a column means
     the same thing whichever beer you are looking at. ("sync" is taken by the
     save indicator in the sidebar, hence the name.) */
  const scroll=el("div",{class:"scroll tall wklock"}), t=el("table",{class:"fg"});
  scroll.addEventListener("scroll",()=>syncAcross(scroll));
  const thead=el("thead"), hr=el("tr",{});
  hr.append(el("th",{class:"stick"},"Week commencing"));
  axis.forEach((w,i)=>{const th=el("th",{class:"wkh"+(i===cwIdx?" now nowcol":"")},
    el("b",{},fmtW(w)),String(D(w).getUTCFullYear()).slice(2));th.title=w;hr.append(th);});
  thead.append(hr); t.append(thead);
  const tb=el("tbody");
  const NP=c.past.length;

  const vcell=(v,i,cls)=>{const td=el("td",{class:"v "+(i<NP?"past ":"")
    +(i===cwIdx?"nowcol ":"")+(cls||"")});
    td.textContent=v==null?"·":F(v);return td;};

  for(const r of c.rows){
    tb.append(el("tr",{class:"sep"},el("td",{colspan:axis.length+1})));
    const tag=r.loc.type==="distributor"?"dist":r.loc.type==="retail"?"retail":"direct";
    const tagcls=r.loc.type==="direct"?"":"d";
    // ship out row
    const tr1=el("tr",{class:"r-out"});
    const lab=el("td",{class:"stick"});
    const labrow=el("div",{class:"lbl"},
      el("span",{class:"tag "+tagcls},tag),
      el("span",{style:"overflow:hidden;text-overflow:ellipsis;flex:1"},r.loc.name));
    if(!r.tracks){
      labrow.append(sel(Object.entries(BASES).filter(([k])=>k!=="planned"),r.basis,
        {class:"basis",title:"How this channel's demand is forecast",
         onchange:e=>setBasis(s.id,r.loc.id,e.target.value)}));
      /* only channels forecasting off last year get the percentage box —
         append() would print a bare "null" for the rest */
      const gb=growthBox(s.id,r); if(gb) labrow.append(gb);
    }
    lab.append(labrow);
    lab.title=r.loc.name+" — "+LOCTYPE[r.loc.type];
    tr1.append(lab);
    /* the two live columns: last week, which is being tidied up on Monday
       morning, and this week, which is being decided on Monday afternoon */
    /* a past load keeps its note and its batch codes: read-only, but the flag
       stays on it and clicking still opens what was recorded */
    (r.pastOut||[]).forEach((v,i)=>tr1.append(
      i>=cwIdx-1?nowCell(s.id,r,c.past[i],v,i===cwIdx)
                :notable(vcell(v,i),s.id,"out|"+s.id+"|"+r.loc.id+"|"+c.past[i])));
    r.ship.forEach((v,i)=>tr1.append(shipCell(s.id,r,c.weeks[i],v)));
    tb.append(tr1);
    // their drawdown + SOH
    if(r.tracks){
      const tr2=el("tr",{});
      const l2=el("td",{class:"stick"});
      const bs=sel(Object.entries(BASES).filter(([k])=>k!=="planned"),r.basis,
        {class:"basis",onchange:e=>setBasis(s.id,r.loc.id,e.target.value)});
      l2.append(el("div",{class:"lbl"},el("span",{style:"padding-left:22px;color:var(--muted)"},"Their drawdown"),
        bs,growthBox(s.id,r)));
      tr2.append(l2);
      (r.pastDraw||[]).forEach((v,i)=>tr2.append(vcell(v,i)));
      r.draw.forEach((v,i)=>tr2.append(drawCell(s.id,r,c.weeks[i],v)));
      tb.append(tr2);
      const tr3=el("tr",{class:"r-soh"});
      const l3=el("td",{class:"stick"});
      const ms=sel([["target_soh","Top up to target"],["planned","Their order plan"]],r.method,
        {class:"basis",onchange:e=>setMethod(s.id,r.loc.id,e.target.value)});
      l3.append(el("div",{class:"lbl"},el("span",{style:"padding-left:22px"},"Their SOH"),ms,
        el("button",{class:"btn sm",style:"padding:1px 5px",
          title:"The stock on hand we top "+r.loc.name+" up to — click to set it for this SKU",
          onclick:()=>editTarget(s,r)},"tgt "+F(r.target)),
        r.lastPlanned?el("span",{class:"hint",style:"color:var(--accent-ink)",
          title:"Their order plan runs to "+fmtD(r.lastPlanned)+", then this channel tops up to target"},
          "plan → "+fmtW(r.lastPlanned)):null));
      tr3.append(l3);
      (r.pastSoh||[]).forEach((v,i)=>tr3.append(
        i>=cwIdx-1&&(reportsOwn(r.loc.id)||!countedAt(r.loc.id,c.past[i]))
          ? sohNowCell(s.id,r,c.past[i],i===cwIdx) : vcell(v,i)));
      r.soh.forEach((v,i)=>{const low=r.target>0&&v<r.target*0.4;
        tr3.append(vcell(v,NP+i,v<0?"neg":low?"low":""));});
      tb.append(tr3);
    }
    /* stock sent back: only drawn where there is some, so the grid doesn't
       grow a row of dots for every channel that has never returned anything */
    if((r.pastRet||[]).some(v=>v!=null&&v!==0)){
      const tr4=el("tr",{class:"r-ret"});
      tr4.append(el("td",{class:"stick"},el("div",{class:"lbl"},
        el("span",{style:"padding-left:22px;color:var(--warn)"},"Returned to us"),
        el("button",{class:"btn sm",style:"padding:0 5px",title:"Returns from "+r.loc.name,
          onclick:()=>editReturns(s,r.loc.id)},"edit"))));
      (r.pastRet||[]).forEach((v,i)=>tr4.append(vcell(v,i,v?"ret":"")));
      c.weeks.forEach((w,i)=>tr4.append(vcell(null,NP+i)));
      tb.append(tr4);
    }
  }
  // ---- coldroom block ----
  tb.append(el("tr",{class:"sep"},el("td",{colspan:axis.length+1})));

  /* read down the column: what was there Monday, what gets packaged, what goes
     out, and what's left — so a week that can't be got through shows up as a
     negative at the end of it, not just as a week that ends short. */
  const trS=el("tr",{});
  trS.append(el("td",{class:"stick"},el("div",{class:"lbl"},
    el("span",{class:"tag c"},"cold"),"Coldroom — start of week")));
  (c.pastCold||[]).forEach((v,i)=>trS.append(vcell(v,i,v!=null&&v<0?"neg":"")));
  c.coldStart.forEach((v,i)=>trS.append(vcell(v,NP+i,v<0?"neg":"")));
  tb.append(trS);

  const trB=el("tr",{});
  trB.append(el("td",{class:"stick"},el("div",{class:"lbl"},
    el("span",{class:"tag c"},"in"),"Beer in (packaged)")));
  /* What went into the coldroom that week. An imported figure is the record;
     where there isn't one the scheduled runs stand in, so a week that is still
     being packaged shows its plan instead of going blank — click it to put the
     actual in once the line has finished. */
  (c.pastIn||c.past.map(()=>null)).forEach((v,i)=>{
    const wk=c.past[i], runs=runsInWeek(s.id,wk);
    const fromRuns=sum(runs.map(runUnits));
    const shown=v!=null?v:(runs.length?fromRuns:null);
    if(!runs.length){
      /* nothing was planned, but it got packaged anyway — click and say so */
      const td=el("td",{class:"v past"+(i===cwIdx?" nowcol":"")});
      td.textContent=shown==null?"·":F(shown);
      td.style.cursor="pointer";
      td.title="Nothing scheduled this week — click to record what was packaged";
      td.onclick=()=>newRun(s.id,wk);
      trB.append(td); return;
    }
    const actual=v!=null||runs.some(r=>r.actualUnits!=null);
    const td=el("td",{class:"v past"+(actual?" edited":" plan")});
    td.append(el("button",{class:"btn sm",style:"padding:1px 5px",
      title:actual?"What was packaged that week — click to correct it"
                  :"Planned for this week — click to enter what actually came off the line",
      onclick:()=>editRunsForWeek(s.id,wk)},F(shown)));
    trB.append(td);
  });
  c.beerIn.forEach((v,i)=>{
    const td=el("td",{class:"v"+(v>0?"":" past")});
    if(v>0){td.append(el("button",{class:"btn sm",style:"padding:1px 5px",
      onclick:()=>editRunsForWeek(s.id,c.weeks[i])},F(v)));}
    else{td.textContent="·";td.style.cursor="pointer";td.title="Schedule a packaging run";
      td.onclick=()=>newRun(s.id,c.weeks[i]);}
    trB.append(td);
  });
  tb.append(trB);

  /* stock moved by hand: a repack, a write-off, beer invoiced early */
  if((c.pastAdj||[]).some(v=>v)||(c.adjFwd||[]).some(v=>v)){
    const trA=el("tr",{});
    trA.append(el("td",{class:"stick"},el("div",{class:"lbl"},
      el("span",{class:"tag c"},"adj"),"Adjustments",
      el("button",{class:"btn sm",style:"padding:0 5px",title:"Stock moved by hand",
        onclick:()=>editAdjust(s)},"edit"))));
    (c.pastAdj||[]).forEach((v,i)=>trA.append(vcell(v||null,i,v?"adj":"")));
    (c.adjFwd||[]).forEach((v,i)=>trA.append(vcell(v||null,NP+i,v?"adj":"")));
    tb.append(trA);
  }

  /* only worth a row when something has actually come back */
  if((c.pastBack||[]).some(v=>v!=null&&v!==0)){
    const trR=el("tr",{});
    trR.append(el("td",{class:"stick"},el("div",{class:"lbl"},
      el("span",{class:"tag c"},"back"),"Returned in (sellable)")));
    (c.pastBack||[]).forEach((v,i)=>trR.append(vcell(v,i,v?"ret":"")));
    c.weeks.forEach((w,i)=>trR.append(vcell(null,NP+i)));
    tb.append(trR);
  }

  const trT=el("tr",{});
  trT.append(el("td",{class:"stick"},el("div",{class:"lbl"},el("span",{class:"tag c"},"out"),"Total shipped out")));
  (c.pastTotalOut||[]).forEach((v,i)=>trT.append(
    i===cwIdx?vcell(c.outNow,i,"plan"):vcell(v,i)));
  c.totalShip.forEach((v,i)=>trT.append(vcell(v,NP+i)));
  tb.append(trT);

  /* start of week, plus what's packaged, less what goes out */
  /* read down the column exactly as it is drawn: start, plus what went in,
     plus what came back, less what went out */
  const inAt=i=>{const v=(c.pastIn||[])[i];
    return v!=null?v:sum(runsInWeek(s.id,c.past[i]).map(runUnits));};
  const outAt=i=>(i===cwIdx?c.outNow:((c.pastTotalOut||[])[i]||0));
  const endOf=i=>{const s0=(c.pastCold||[])[i];
    if(s0==null) return null;
    return s0+inAt(i)+((c.pastBack||[])[i]||0)+((c.pastAdj||[])[i]||0)-outAt(i);};
  const trC=el("tr",{class:"tot"});
  trC.append(el("td",{class:"stick"},el("div",{class:"lbl"},
    el("span",{class:"tag c"},"cold"),"Coldroom — end of week")));
  (c.pastCold||[]).forEach((_,i)=>{const v=endOf(i);
    trC.append(vcell(v,i,v!=null&&v<0?"neg":""));});
  c.cold.forEach((v,i)=>trC.append(vcell(v,NP+i,v<0?"neg":v<c.wkAvg*1.5?"low":"")));
  tb.append(trC);

  const trD=el("tr",{});
  trD.append(el("td",{class:"stick"},el("div",{class:"lbl"},
    el("span",{style:"padding-left:22px;color:var(--muted)"},"Weeks of cover"))));
  c.past.forEach((w,i)=>trD.append(vcell(null,i)));
  c.cover.forEach((v,i)=>trD.append(vcell(v==null?null:Math.round(v*10)/10,NP+i,

          placeholder:"qty",style:"width:62px"}),

      onclick:()=>addLine("",null)},"Another batch"));

                                     qty:row.querySelector(".bqty").value})));

    el("button",{class:"btn sm pri",onclick:save},"Save")));

/* ---- what the wholesaler is holding, batch by batch ----
   They tell us one number on a Monday and nothing about batches. We know what
   we sent them and which batches went in each load. If they ship oldest first,
   which they do, their stock on hand must be the newest arrivals: work back
   from the most recent load until the quantity adds up, and whatever is left
   over at the front has been sold. What comes out is an inference, not a
   count, so it is always labelled as one.

   plan.batches[locId][week] = [{code, qty}] — what went out that week. */
function shipBatches(sku,loc,wk){
  const b=((planOf(sku).batches||{})[loc]||{})[wk];
  return Array.isArray(b)?b.filter(x=>x&&x.code):[];
}
function setShipBatches(sku,loc,wk,list){
  const pl=planOf(sku);
  pl.batches=pl.batches||{}; pl.batches[loc]=pl.batches[loc]||{};
  const keep=(list||[]).filter(x=>x&&x.code&&x.code.trim())
    .map(x=>({code:x.code.trim(),qty:num(x.qty)}));
  if(keep.length) pl.batches[loc][wk]=keep; else delete pl.batches[loc][wk];
  if(!Object.keys(pl.batches[loc]).length) delete pl.batches[loc];
  persist("plan",pl);
}
/* best before for a batch, from wherever we have counted it */
function batchBB(sku,code){
  for(const st of S.stock){
    for(const e of (st.entries||[])){
      if((e.batch||"")===code&&skuId(e.productId,e.pack)===sku&&e.bestBefore) return e.bestBefore;
    }
  }
  for(const r of S.runs){
    if(skuId(r.productId,r.pack)===sku&&(r.batch||"")===code&&r.packDate){
      const sm=shelfMonths(r.productId,r.pack);
      return addMonths(r.packDate,sm);
    }
  }
  return null;
}
/* Every load we have batch codes for, oldest first, as it lands on their
   shelf — a shipment takes the channel's lead time to arrive. */
function arrivals(sku,locId,upTo){
  const pl=planOf(sku), l=L(locId)||{};
  const lead=Math.max(0,l.leadTimeWeeks||0);
  const by=(pl.batches||{})[locId]||{};
  const out=[];
  for(const wk of Object.keys(by).sort()){
    const landed=wkAdd(wk,lead);
    if(upTo&&landed>upTo) continue;
    const lines=shipBatches(sku,locId,wk);
    const shipped=at(sku,"out",histLoc(sku,"out",locId),wk);
    /* one batch and no quantity given means the whole load was that batch */
    const total=sum(lines.map(x=>num(x.qty)||0));
    for(const x of lines){
      let q=num(x.qty);
      if(q==null) q=(lines.length===1&&shipped!=null)?shipped:null;
      if(q==null||q<=0) continue;
      out.push({code:x.code,qty:q,sent:wk,landed,bb:batchBB(sku,x.code)});
    }
    if(!total&&lines.length>1&&shipped) {
      /* several batches, no split given: share the load evenly between them */
      const each=Math.round(shipped/lines.length*100)/100;
      for(const x of lines) out.push({code:x.code,qty:each,sent:wk,landed,bb:batchBB(sku,x.code)});
    }
  }
  return out.sort((a,b)=>a.landed<b.landed?-1:a.landed>b.landed?1:0);
}
/* Their holding at a week, worked back from the figure they reported. */
function fifoHolding(sku,locId,wk){
  const week=wk||S.config.currentWeek;
  const soh=at(sku,"soh",histLoc(sku,"soh",locId),week);
  const arr=arrivals(sku,locId,week);
  const known=sum(arr.map(a=>a.qty));
  if(soh==null) return {soh:null,arrivals:arr,known,lines:[],unknown:0,short:0};
  let left=soh;
  const lines=[];
  /* newest first: that is what is still there under first-in-first-out */
  for(let i=arr.length-1;i>=0&&left>0.001;i--){
    const take=Math.min(arr[i].qty,left);
    lines.unshift(Object.assign({},arr[i],{qty:Math.round(take*100)/100,
      part:take<arr[i].qty-0.001}));
    left-=take;
  }
  return {soh,arrivals:arr,known,lines,
    /* more on their shelf than we have codes for: older stock we never recorded */
    unknown:Math.round(left*100)/100,
    /* codes we sent that must already have gone out the door */
    short:Math.round((known-(soh-left))*100)/100};
}

        ?(set?"Known order — clear this to go back to topping up to target"
            :"Topping up to "+F(r.target)+". Type a figure if you already know what's going.")
        :"What we plan to send. Type a figure to fix it.",
    onchange:e=>setShip(sku,r,wk,e.target.value)});
  td.append(inp); return notable(td,sku,"ship|"+sku+"|"+r.loc.id+"|"+wk);
}
function setShip(sku,r,wk,val){
  const field=shipField(r.method), pl=planOf(sku);
  pl[field][r.loc.id]=pl[field][r.loc.id]||{};
  const v=num(val);
  if(v==null) delete pl[field][r.loc.id][wk]; else pl[field][r.loc.id][wk]=v;
  /* typed figures win — but a flat channel is meant to carry one figure forward,
     so typing into it must not quietly drop it back to manual entry */
  if(field==="manual"&&pl.basis[r.loc.id]!=="flat") pl.basis[r.loc.id]="manual";
  persist("plan",pl); reflow();
}
function setPlanned(sku,loc,wk,val){const pl=planOf(sku);pl.planned[loc]=pl.planned[loc]||{};
  const v=num(val); if(v==null) delete pl.planned[loc][wk]; else pl.planned[loc][wk]=v;
  persist("plan",pl);reflow();}
function setBasis(sku,loc,v){const pl=planOf(sku);pl.basis[loc]=v;persist("plan",pl);render();}
function setMethod(sku,loc,v){const pl=planOf(sku);pl.method[loc]=v;persist("plan",pl);render();}
/* ---- clearing typed figures in bulk ----
   A week that has been typed over stops following the forecast until the cell is
   emptied again. After a busy week that is a lot of cells to go back through one
   at a time, so this lists everywhere a figure has been typed and clears whole
   rows of them at once. */
const TYPED_KIND={override:"known order",planned:"order plan",manual:"typed figure"};
function typedEntries(sku,from){
  const pl=planOf(sku), out=[];
  for(const field of ["override","planned","manual"]){
    const d=pl[field]||{};
    for(const loc in d){
      const weeks=Object.keys(d[loc]||{})
        .filter(w=>d[loc][w]!=null&&(!from||w>=from)).sort();
      if(weeks.length) out.push({sku,field,loc,weeks});
    }
  }
  return out;
}
/* The count on the button is overrides only — figures holding a week against a
   calculation. A distributor's order plan is their figure rather than ours, and
   a direct channel on manual entry is simply how that channel is forecast, so
   neither is an override. The dialog still lists the lot. */
function typedCount(sku){
  return typedEntries(sku,S.config.currentWeek).filter(e=>{
    if(e.field==="override") return true;
    if(e.field!=="manual") return false;
    const l=L(e.loc);
    return !!l&&l.type!=="direct";
  }).reduce((n,e)=>n+e.weeks.length,0);
}
function clearTyped(s){
  const cw=S.config.currentWeek;
  let scope="sku", from=cw;
  const picked=new Set();
  const key=e=>e.sku+"|"+e.field+"|"+e.loc;
  const entries=()=>(scope==="all"?skus().map(x=>x.id):[s.id])
    .reduce((a,id)=>a.concat(typedEntries(id,from||null)),[]);
  const list=el("div",{style:"max-height:46vh;overflow:auto"});
  const tally=el("div",{class:"hint"},"");
  const count=()=>{
    const es=entries().filter(e=>picked.has(key(e)));
    const n=es.reduce((a,e)=>a+e.weeks.length,0);
    tally.textContent=n?("Clearing "+n+" figure"+(n===1?"":"s")+" across "+es.length+
      " row"+(es.length===1?"":"s")):"Nothing ticked";
  };
  const draw=()=>{
    clear(list); picked.clear();
    const es=entries();
    if(!es.length){ list.append(el("div",{class:"empty"},"Nothing has been typed over.")); count(); return; }
    /* only known orders typed over a calculated top-up start ticked. The order
       plans are the distributors' own figures and the manual figures largely
       came across from the sheet, so clearing those is a deliberate act, not a
       default — "Tick all" is one click away. */
    for(const e of es) if(e.field==="override") picked.add(key(e));
    for(const e of es){
      list.append(el("label",{class:"row",style:"gap:10px;align-items:center;padding:5px 2px;cursor:pointer"},
        el("input",{type:"checkbox",checked:picked.has(key(e)),
          onchange:ev=>{ev.target.checked?picked.add(key(e)):picked.delete(key(e));count();}}),
        el("span",{style:"flex:1"},
          (scope==="all"?skuLabel(e.sku)+"  ·  ":"")+((L(e.loc)||{}).name||e.loc),
          el("span",{class:"dim"},"  ·  "+TYPED_KIND[e.field])),
        el("span",{class:"hint"},e.weeks.length+" wk"+(e.weeks.length===1?"":"s")+"  ·  "+
          fmtD(e.weeks[0])+(e.weeks.length>1?" – "+fmtD(e.weeks[e.weeks.length-1]):""))));
    }
    count();
  };
  const tickAll=on=>{
    for(const cb of list.querySelectorAll("input[type=checkbox]")){
      if(cb.checked!==on){ cb.checked=on; cb.dispatchEvent(new Event("change")); }
    }
  };
  openDialog("Clear typed figures",b=>{
    b.append(el("div",{class:"note"},el("b",{},"Typed figures hold their week against the forecast. "),
      "Clearing one hands that week back to the calculation. Known orders you have typed over a "+
      "top-up start ticked; the distributors' order plans and the manual figures that came across "+
      "from the sheet don't, so nothing goes by accident — tick all if you do want the lot. "+
      "Actuals already shipped aren't touched."));
    b.append(el("div",{class:"grid2"},
      field("Which SKUs",sel([["sku",skuLabel(s.id)],["all","Every SKU"]],scope,
        {onchange:e=>{scope=e.target.value;draw();}})),
      field("Which weeks",sel([[cw,"This week and after"],["","Every week, including past"]],cw,
        {onchange:e=>{from=e.target.value||null;draw();}}))));
    b.append(el("div",{class:"row",style:"gap:8px"},
      el("button",{class:"btn sm",type:"button",onclick:()=>tickAll(true)},"Tick all"),
      el("button",{class:"btn sm",type:"button",onclick:()=>tickAll(false)},"Tick none"),
      el("span",{style:"flex:1"}),tally));
    b.append(list); draw();
  },()=>{
    const es=entries().filter(e=>picked.has(key(e)));
    if(!es.length){ flash("Nothing ticked"); return false; }
    let n=0; const touched=new Set();
    for(const e of es){
      const pl=planOf(e.sku), d=pl[e.field][e.loc]||{};
      for(const w of e.weeks) if(d[w]!=null){ delete d[w]; n++; }
      if(!Object.keys(d).length) delete pl[e.field][e.loc];
      /* a channel that went to manual entry only because a figure was typed is
         left pointing at nothing, so hand it back to the default basis */
      if(e.field==="manual"&&pl.basis&&pl.basis[e.loc]==="manual"&&
         !Object.keys(pl.manual[e.loc]||{}).length) delete pl.basis[e.loc];
      touched.add(e.sku);
    }
    for(const id of touched) persist("plan",planOf(id));
    S.calcCache=null;
    flash(n+" typed figure"+(n===1?"":"s")+" cleared");
  },"Clear selected");
}
function saveConfig(){persist("config",Object.assign({id:"app"},S.config));}
</script>
<script>
"use strict";
/* ============================ 2. STOCKTAKE ============================ */
let stWeek=null;
function curStocktake(){
  if(!S.stock.length) return null;
  if(stWeek){const f=S.stock.find(s=>s.weekStart===stWeek); if(f) return f;}
  return S.stock[0];
}
function viewStocktake(pane,ctl){
  const st=curStocktake();
  ctl.append(sel(S.stock.map(s=>[s.weekStart,fmtWY(s.weekStart)+"  ·  "+(s.entries||[]).length+" lines"]),
    st?st.weekStart:"",{onchange:e=>{stWeek=e.target.value;render();}}));
  ctl.append(el("button",{class:"btn",title:"Fold every count back into the weekly history and work the drawdowns out again",
    onclick:()=>{
      const n=syncHistoryFromStocktakes(true);
      flash(n.size?("Stock on hand and drawdown refreshed for "+n.size+" SKUs"):"Already up to date");
      render();
    }},"Recalculate from stocktakes"));
  if(st) ctl.append(el("button",{class:"btn",title:"Delete this count and the stock on hand it wrote",
    onclick:()=>deleteStocktake(st)},"Delete"));
  if(st&&recountCount(st)) ctl.append(el("button",
    {class:"btn"+(stRecountOnly?" pri":""),
     title:"Show only the lines that disagree with the ERP or are flagged to count again",
     onclick:()=>{stRecountOnly=!stRecountOnly;render();}},
    stRecountOnly?("Showing "+recountCount(st)+" to re-count — show all")
                 :("Re-count ("+recountCount(st)+")")));
  ctl.append(el("button",{class:"btn pri",onclick:newStocktake},"New stocktake"));
  if(!st){
    pane.append(el("div",{class:"card"},el("div",{class:"empty"},el("b",{},"No stocktakes yet"),
      "Start one for the week commencing "+fmtWY(S.config.currentWeek)+" and count what's in the coldroom and at each distributor.")));
    return;
  }
  const byLoc={};
  for(const e of (st.entries||[])){(byLoc[e.locationId]=byLoc[e.locationId]||[]).push(e);}
  const t=el("div",{class:"tiles"});
  const wkTile=tile("Week","w/c "+fmtWY(st.weekStart),"");
  wkTile.lastChild.id="stProgress"; wkTile.lastChild.textContent=stProgressText(st);
  t.append(wkTile);
  const nDiff=recountCount(st), nWhy=unexplained(st);
  if(nDiff) t.append(tile("Against the ERP",String(nDiff),
    nWhy?(nWhy+" still need a reason"):"all explained",nWhy?"warn":"ok"));
  const locOrder=Object.keys(byLoc).sort((a,b)=>((L(a)||{}).sort|0)-((L(b)||{}).sort|0));
  for(const lid of locOrder.slice(0,nDiff?4:5)){
    const rows=byLoc[lid],ctns=sum(rows.filter(r=>r.pack==="Can"||r.pack==="10 Pack").map(r=>r.qty)),
      kegs=sum(rows.filter(r=>r.pack==="Keg").map(r=>r.qty)),k30=sum(rows.filter(r=>r.pack==="30L Keg").map(r=>r.qty));
    t.append(tile((L(lid)||{name:lid}).name,n0(ctns)+" ctn",n0(kegs)+" × 50L · "+n0(k30)+" × 30L"));
  }
  pane.append(t);

  pane.append(el("div",{class:"note"},el("b",{},"How this is used. "),
    "The most recent stocktake sets opening stock for the forecast — coldroom and each distributor's shelf. ",
    "Best-before dates on each batch drive the aged-stock and send-by flags."));

  const counted=new Set((st.entries||[]).map(e=>skuId(e.productId,e.pack)));
  const missed=skus().filter(s=>s.product.forecast!==false&&!counted.has(s.id));
  if(missed.length){
    const m=el("div",{class:"card"});
    m.append(el("header",{},el("h3",{},"Not counted this week"),
      el("span",{class:"chip warn"},missed.length+" SKUs"),el("span",{style:"flex:1"}),
      el("span",{class:"hint"},"Forecasting from the last known figure until they're counted")));
    const w=el("div",{class:"scroll"}),tb=el("table");
    tb.append(el("thead",{},el("tr",{},el("th",{},"SKU"),el("th",{class:"num"},"Coldroom carried forward"),el("th",{},""))));
    const body=el("tbody");
    for(const s of missed) body.append(el("tr",{class:"stripe warn"},
      el("td",{},el("b",{},s.product.name+" "+s.pack)),
      el("td",{class:"num"},n0(openingSOH(s.id,"coldroom"))),
      el("td",{},el("button",{class:"btn sm",onclick:()=>editEntry(st,{locationId:"coldroom",
        productId:s.product.id,pack:s.pack})},"Count it"))));
    tb.append(body);w.append(tb);m.append(w);pane.append(m);
  }

  for(const lid of locOrder){
    const loc=L(lid)||{name:lid,type:"distributor"};
    const rows=byLoc[lid].slice().sort((a,b)=>(a.productId+a.pack).localeCompare(b.productId+b.pack));
    const c=el("div",{class:"card"});
    c.append(el("header",{},el("h3",{},loc.name),
      el("span",{class:"chip acc"},LOCTYPE[loc.type]||"Location"),
      reportsOwn(lid)?el("span",{class:"chip warn",
        title:"They report their own stock on hand — type it into the forecast grid. "+
              "Anything counted here is kept as a record but doesn't move the forecast."},
        "reported, not counted"):null,
      el("span",{class:"chip"},rows.length+" lines"),
      el("span",{style:"flex:1"}),
      el("span",{class:"chip"},n0(sum(rows.map(r=>r.qty)))+" counted"),
      el("button",{class:"btn sm",onclick:()=>editEntry(st,{locationId:lid})},"Add line")));
    const w=el("div",{class:"scroll tall"}), tb=el("table");
    tb.append(el("thead",{},el("tr",{},el("th",{},"Product"),el("th",{},"Pack"),el("th",{},"Batch"),
      el("th",{},"Where"),
      el("th",{class:"num"},"Last week"),
      el("th",{class:"num"},"Count"),
      el("th",{class:"num"},"ERP"),el("th",{class:"num"},"Diff"),
      el("th",{},"Note"),el("th",{title:"Flag this line to be counted again"},"Re-count"),
      el("th",{},"Best before"),el("th",{},"Send by"),
      el("th",{class:"num"},"Days left"),el("th",{},""))));
    const body=el("tbody");
    for(const e of rows){
      if(stRecountOnly&&!needsRecount(e)) continue;
      const F=partUnits(e.productId,e.pack)?nq:n0;
      const sm=shelfMonths(e.productId,e.pack);
      const sb=e.bestBefore?iso(new Date(D(e.bestBefore)-Math.round(sm/2*30.44)*DAY)):null;
      const d=sb?dDiff(S.config.currentWeek,sb):null;
      const qty=el("input",{class:"cellinp num qty",type:"text",inputmode:"decimal",
        value:e.qty!=null?F(e.qty):"", placeholder:"—",
        title:"Leave blank until it's counted; type 0 for a bay with none in it",
        onfocus:ev=>ev.target.select(),
        onkeydown:ev=>stepCell(ev),
        onchange:ev=>{e.qty=num(ev.target.value);stSave(st);}});
      const bat=el("input",{class:"cellinp mono",type:"text",value:e.batch||"",placeholder:"batch",
        onkeydown:ev=>stepCell(ev),
        onchange:ev=>{e.batch=ev.target.value.trim();stSave(st);}});
      const bb=el("input",{class:"cellinp mono",type:"date",value:e.bestBefore||"",
        onchange:ev=>{e.bestBefore=ev.target.value||null;stSave(st);render();}});
      /* where in the building this lot sits */
      const ar=areaCell(st,e);
      /* what the ERP says it holds, against what was counted */
      const erp=el("input",{class:"cellinp num",type:"text",inputmode:"decimal",
        value:e.erp!=null?F(e.erp):"",placeholder:"—",
        title:"What the ERP says for this batch",
        onfocus:ev=>ev.target.select(), onkeydown:ev=>stepCell(ev),
        onchange:ev=>{const v=num(ev.target.value); if(v==null) delete e.erp; else e.erp=v;
          stSave(st);reflow();}});
      const diff=(e.qty!=null&&e.erp!=null)?Math.round((e.qty-e.erp)*100)/100:null;
      const prev=lastWeekQty(st,e);
      /* a line that disagrees with the ERP needs a reason before it's settled */
      const owes=!!diff&&!(e.note||"").trim();
      const note=el("input",{class:"cellinp"+(owes?" owes":""),type:"text",
        value:e.note||"",
        placeholder:owes?"why the difference?":"note",
        title:owes?"This line disagrees with the ERP — say why before it's signed off"
                  :"Anything worth remembering about this line",
        onkeydown:ev=>stepCell(ev),
        onchange:ev=>{const v=ev.target.value.trim();
          if(v) e.note=v; else delete e.note; stSave(st); reflow();}});
      const rc=el("input",{type:"checkbox",class:"rc",checked:!!e.recount,
        title:"Count this one again",
        onchange:ev=>{if(ev.target.checked) e.recount=true; else delete e.recount;
          stSave(st); reflow();}});
      body.append(el("tr",{class:"stripe "+(e.recount?"warn ":"")+(d==null?"":d<=0?"crit":d<=28?"warn":""),
          "data-zero":String(e.qty==null)},
        el("td",{},swatch(e.productId),(P(e.productId)||{name:e.productId}).name),
        el("td",{class:"dim"},e.pack),
        el("td",{class:"cell"},bat),
        el("td",{class:"cell"},ar),
        el("td",{class:"num dim",title:"Counted in the previous stocktake"},prev==null?"—":F(prev)),
        el("td",{class:"cell"},qty),
        el("td",{class:"cell"},erp),
        el("td",{class:"num"+(diff?" neg":"")},diff==null?"—":(diff>0?"+":"")+F(diff)),
        el("td",{class:"cell"},note),
        el("td",{class:"cell mid"},rc),
        el("td",{class:"cell"},bb),
        el("td",{class:"mono dim"},fmtD(sb)),
        el("td",{class:"num"},d==null?"—":String(d)),
        el("td",{},el("button",{class:"btn sm",title:"Remove this line",
          onclick:()=>{if(!confirm("Remove this line from the stocktake?"))return;
            st.entries=st.entries.filter(x=>x.id!==e.id);stSave(st);render();}},"×"))));
    }
    if(!body.children.length) continue;      /* nothing here to re-count */
    tb.append(body); w.append(tb); c.append(w); pane.append(c);
  }
}
/* ---- lines that aren't settled ----
   A line disagreeing with the ERP, or flagged to be counted again. Re-count
   mode shows nothing else, so a recount is a short list rather than a hunt
   back through the whole sheet. */
let stRecountOnly=false;
function stDiff(e){
  return (e.qty!=null&&e.erp!=null)?Math.round((e.qty-e.erp)*100)/100:null;
}
function needsRecount(e){ return !!e.recount||!!stDiff(e); }
function recountCount(st){ return (st.entries||[]).filter(needsRecount).length; }
function unexplained(st){
  return (st.entries||[]).filter(e=>stDiff(e)&&!(e.note||"").trim()).length;
}
/* ---- what this line held last time ----
   Matched on the batch where there is one, since that is the same physical
   pallet; otherwise on the SKU at that location, totalled, which is the only
   honest comparison when the batches have turned over. */
function prevStocktake(st){
  const earlier=S.stock.filter(x=>x.weekStart<st.weekStart)
    .sort((a,b)=>a.weekStart<b.weekStart?1:-1);
  return earlier[0]||null;
}
function lastWeekQty(st,e){
  const p=prevStocktake(st); if(!p) return null;
  const same=(p.entries||[]).filter(x=>x.locationId===e.locationId&&x.productId===e.productId&&x.pack===e.pack);
  if(!same.length) return null;
  if(e.batch){
    const hit=same.filter(x=>(x.batch||"")===e.batch);
    if(hit.length) return sum(hit.map(x=>x.qty||0));
    return null;                       /* a new batch: nothing to compare it to */
  }
  return sum(same.map(x=>x.qty||0));
}
/* ---- where in the building ----
   The list of areas is kept in Setup; a line can also be left blank. */
function areaList(){ return (S.config.areas||[]).filter(Boolean); }
function areaCell(st,e){
  const opts=[["","—"],...areaList().map(a=>[a,a])];
  const cur=e.area||"";
  if(cur&&!areaList().includes(cur)) opts.push([cur,cur]);
  return sel(opts,cur,{class:"cellinp",
    title:"Where this lot is — the list is set up under Setup",
    onchange:ev=>{const v=ev.target.value; if(!v) delete e.area; else e.area=v; stSave(st);}});
}
/* inline grid entry: debounce writes so typing down a column is one save, not fifty */
let stTimer=null, stPending=null;
function stSave(st){
  S.calcCache=null; stPending=st;
  const chip=$("#stProgress"); if(chip) chip.textContent=stProgressText(st);
  clearTimeout(stTimer);
  stTimer=setTimeout(()=>{ if(stPending){persist("stocktakes",stPending); stPending=null;} },700);
}
function stProgressText(st){
  const n=(st.entries||[]).length, done=(st.entries||[]).filter(e=>e.qty!=null).length;
  return done+" of "+n+" lines counted";
}
/* Enter / arrows walk down the column so a count can be typed without the mouse */
function stepCell(ev){
  const k=ev.key;
  if(k!=="Enter"&&k!=="ArrowDown"&&k!=="ArrowUp") return;
  if(k!=="Enter"&&ev.target.type==="date") return;
  const td=ev.target.closest("td"), tr=td&&td.closest("tr");
  if(!tr) return;
  const i=[...tr.children].indexOf(td);
  const next=(k==="ArrowUp")?tr.previousElementSibling:tr.nextElementSibling;
  const to=next&&next.children[i]&&next.children[i].querySelector("input");
  if(to){ ev.preventDefault(); to.focus(); if(to.select) to.select(); }
}

/* Deleting a count started by mistake. The figures it wrote into the weekly
   history go with it — but only where the stored figure is still the one this
   count put there, so anything typed or imported over the top since is left
   alone. The drawdowns worked out from those figures go too, since they were
   only ever an arithmetic consequence of them. */
function deleteStocktake(st){
  const lines=(st.entries||[]).length;
  const owned=()=>{
    const by={};
    for(const e of (st.entries||[])){
      const k=skuId(e.productId,e.pack)+"|"+e.locationId;
      by[k]=(by[k]||0)+(e.qty||0);
    }
    const hits=[];
    for(const k of Object.keys(by)){
      const [sku,loc]=k.split("|");
      if(!S.hist[sku]) continue;
      const cur=at(sku,"soh",histLoc(sku,"soh",loc),st.weekStart);
      if(cur!=null&&Math.abs(cur-by[k])<0.001) hits.push([sku,loc]);
    }
    return hits;
  };
  const hits=owned();
  openDialog("Delete the stocktake for w/c "+fmtWY(st.weekStart),b=>{
    b.append(el("div",{class:"note"},
      el("b",{},lines+" counted line"+(lines===1?"":"s")+" will go. "),
      hits.length?("The stock on hand it wrote goes too — "+hits.length+" figure"+
        (hits.length===1?"":"s")+" across the weekly history, with the drawdowns worked out from them. ")
        :"Nothing in the weekly history still carries this count's figures, so only the count itself goes. ",
      "Anything typed or imported over the top since is left alone."));
    b.append(el("div",{class:"hint"},
      "If this week also came from the Stock Management Sheet, the next import brings it back."));
  },()=>{
    const touched=new Set();
    for(const [sku,loc] of hits){
      histSet(sku,"soh",loc,st.weekStart,null);
      histSet(sku,"used",loc,st.weekStart,null);
      touched.add(sku);
    }
    S.stock=S.stock.filter(x=>x.id!==st.id);
    remove("stocktakes",st.id);
    for(const sku of touched){
      for(const l of activeLocs()) deriveUsed(sku,l.id,wkAdd(st.weekStart,1));
      persist("history",stripIx(S.hist[sku]));
    }
    if(stWeek===st.weekStart) stWeek=null;
    S.calcCache=null;
    flash("Stocktake for w/c "+fmtWY(st.weekStart)+" deleted");
  },"Delete stocktake");
}
function newStocktake(){
  const last=S.stock[0];
  openDialog("New stocktake",b=>{
    b.append(el("div",{class:"grid2"},
      field("Week commencing",el("input",{type:"date",id:"stw",value:S.config.currentWeek})),
      field("Start from",sel([["copy","Last stocktake's batches (qty cleared)"],["blank","Empty sheet"]],
        last?"copy":"blank",{id:"stmode"}))));
    b.append(el("div",{class:"note"},"Counts are entered per batch so best-before dates stay attached to the stock. ",
      "Copying last week keeps the batch and best-before columns so you only type quantities."));
  },body=>{
    const w=monday($("#stw",body).value||S.config.currentWeek);
    if(S.stock.some(s=>s.weekStart===w)){flash("A stocktake already exists for that week");return false;}
    const mode=$("#stmode",body).value;
    /* copied lines start UNCOUNTED, not at zero: a blank quantity means nobody
       has been to that pallet yet, where a zero means someone went and found
       none. Starting them at zero told the forecast the whole warehouse was
       empty the moment the count was created. */
    const entries=(mode==="copy"&&last
      ?(last.entries||[]).filter(e=>!reportsOwn(e.locationId)).map(e=>({...e,id:uid("e"),qty:null}))
      :[]);
    const doc={id:w,weekStart:w,status:"draft",entries,createdAt:new Date().toISOString(),note:""};
    S.stock.unshift(doc); S.stock.sort((a,b)=>a.weekStart<b.weekStart?1:-1);
    /* counting a week early must not drag the whole app forward with it */
    persist("stocktakes",doc); stWeek=w;
    flash("Stocktake created for w/c "+fmtWY(w));
  },"Create");
}
function editEntry(st,e){

    if(!isNew) b.append(el("button",{class:"btn danger",type:"button",style:"align-self:flex-start",
      onclick:()=>{st.entries=st.entries.filter(x=>x.id!==e.id);persist("stocktakes",st);$("#dlg").close();render();}},"Delete line"));
    syncPacks(b,e.pack);
